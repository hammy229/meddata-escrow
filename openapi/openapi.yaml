openapi: 3.1.0
info:
  title: MedData Escrow API
  version: 0.4.0
  summary: Escrowed marketplace for synthetic medical datasets, settled with PayPal.
  description: |
    MedData Escrow lets a researcher describe a study in plain English, match it
    to vendor datasets, and buy access through an **escrow** built on PayPal
    authorize-then-capture. Funds are held (authorized) while the data is
    delivered, captured once the buyer accepts it, and paid out to the vendor.
    A buyer can dispute while funds are held, and an operator resolves the
    dispute toward capture or void.

    After delivery the researcher asks plain-English questions. Each question is
    screened for identifiers, compiled to aggregate-only SQL, re-checked, run
    vendor-side, put through small-cell suppression, and metered per answer at a
    server-set fee. Metering is kept in our own ledger, not billed through
    PayPal. Each order has a query spend cap (`queryCapCents`, default 1000);
    once a query would go past it, the server answers `402` and bills nothing.

    **All data is synthetic** (Synthea-generated cohorts). No real patient data
    is stored or returned.

    The server, not the client, decides who pays what and who sees what:
    the escrowed amount is always the dataset's listed price, queries require a
    paid and delivered order, and the per-query fee is fixed server-side.

    Errors are always `{ "error": string }`, plus `reasons: string[]` on
    privacy rejections.

    Run with `PAYPAL_MODE=mock` to drive the whole escrow arc with no PayPal
    credentials; responses then carry `mock: true` and `MOCK-*` ids. In mock
    mode the approve link is a local page (`/checkout/mock`), and
    shared demo resets are disabled. Accounts and setup are required for workspaces.
    Order access uses account IDs, and provider access is scoped to the owning vendor.
  license:
    name: MIT
    identifier: MIT
security: []
servers:
  - url: http://localhost:3000
    description: Local dev server (`npm run dev` or `npm run dev:mock`)
tags:
  - name: System
    description: Health and API metadata.
  - name: Catalog
    description: Dataset listings and vendor pricing.
  - name: Matching
    description: Rank catalog datasets against a study description.
  - name: Orders
    description: Escrow lifecycle (PayPal authorize-then-capture) and order reads.
  - name: Query
    description: Privacy-safe, metered plain-English queries over a purchased dataset.
  - name: Billing
    description: Per-query usage and spend.
  - name: Agent
    description: AI procurement agent that plans a purchase end to end.
  - name: Mandates
    description: Signed spending mandates that bound what an agent may buy.
  - name: Webhooks
    description: Inbound PayPal webhook events.
paths:
  /api/auth/{action}:
    post:
      tags: [System]
      operationId: manageAccountSession
      summary: Sign up, sign in, sign out, or save account setup
      description: |
        Signup takes name, email, password (12–128 characters), and role
        (researcher or vendor). Login takes email and password. Both set an
        HttpOnly session cookie and return a local redirect path. Setup requires
        a session and takes organization, purpose (10–2000 characters), and
        payoutEmail (required for vendors). Logout revokes the current session.
        Cross-origin writes are rejected. Attempts are rate limited per IP.
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [signup, login, logout, setup]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
                role: { type: string, enum: [researcher, vendor] }
                organization: { type: string }
                purpose: { type: string, minLength: 10, maxLength: 2000 }
                payoutEmail: { type: string }
      responses:
        "200":
          description: Session or setup saved; follow the redirect path.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect: { type: string }
        "400":
          description: Invalid account details.
        "401":
          description: Invalid credentials or missing session.
        "403":
          description: Cross-site request rejected.
        "409":
          description: Account could not be created with this email.
        "429":
          description: Too many attempts; try again in a minute.
  /api/escrow/sweep:
    post:
      tags: [Orders]
      operationId: sweepEscrow
      summary: Act on escrow deadlines
      description: |
        For a scheduler, not a browser. Delivered orders the buyer has not
        answered within 7 days release the payment to the vendor. Orders the
        vendor has not delivered by day 28 of the hold are voided, so the buyer
        keeps the money. Disputes are never moved, only flagged for review once
        their hold is about to expire. Running it twice changes nothing.
      responses:
        "200":
          description: What the sweep did. A failed move stays put and is retried next time.
          content:
            application/json:
              schema:
                type: object
                required: [released, refunded, needsReview, blocked, failed]
                properties:
                  released: { type: array, items: { type: string } }
                  refunded: { type: array, items: { type: string } }
                  needsReview: { type: array, items: { type: string } }
                  blocked:
                    type: array
                    description: Orders the delivery audit kept from being released automatically.
                    items:
                      type: object
                      required: [orderId, reason]
                      properties:
                        orderId: { type: string }
                        reason: { type: string }
                  failed:
                    type: array
                    items:
                      type: object
                      required: [orderId, error]
                      properties:
                        orderId: { type: string }
                        error: { type: string }
        "401":
          description: Wrong or missing secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "`ESCROW_SWEEP_SECRET` is not configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - sweepSecret: []
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and readiness probe
      description: |
        Runs a trivial `SELECT 1` through the normal DB path. Reports the
        PayPal mode only as `mock` or `live`; no credentials, paths, or error
        details are ever echoed. Never cached.
      responses:
        "200":
          description: Database reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value: { status: ok, mode: mock, db: ok }
        "503":
          description: Database could not be opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                dbDown:
                  value: { status: error, mode: live, db: error }

  /api/openapi:
    get:
      tags: [System]
      operationId: getOpenApiSpec
      summary: This OpenAPI document
      description: |
        Serves `openapi/openapi.yaml`: parsed to JSON by default, or the raw
        YAML with `?format=yaml`. Point Postman or APIMatic at this URL to
        import the API.
      parameters:
        - name: format
          in: query
          description: "`yaml` returns the file verbatim; anything else returns JSON."
          schema:
            type: string
            enum: [json, yaml]
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
                description: OpenAPI 3.1 document.
                additionalProperties: true
              examples:
                spec:
                  value:
                    openapi: 3.1.0
                    info: { title: MedData Escrow API, version: 0.4.0 }
            application/yaml:
              schema:
                type: string

  /api/match:
    post:
      security: [{ sessionCookie: [] }]
      tags: [Matching]
      operationId: matchDatasets
      summary: Rank datasets for a study description
      description: |
        Returns catalog datasets ranked by relevance to a plain-English study
        description, each enriched with its catalog title, its listed price and
        its record count. The price is the one stored in the database, which is
        what an order charges, so a vendor's repricing shows up here at once.

        When `LLM_PROVIDER=bedrock`, Claude on Amazon Bedrock ranks the catalog;
        otherwise (or if the model call fails) a deterministic keyword matcher
        does. `source` says which (`llm` | `keyword`), per response and per match.

        The body may instead be `{ "sampleCheck": datasetId, "description"? }` to
        run the pre-purchase sample quality check on one dataset. The check can
        only tighten: the model's verdict is AND-ed with deterministic rules.

        Or `{ "fitnessCheck": datasetId, "description"? }` to run the fitness
        audit on the sample of a SYNTHETIC fixture listing. It returns
        `{ "fitnessCheck": null }` when the listing has no rows to screen. The
        audit is a screen, not proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MatchRequest"
                - $ref: "#/components/schemas/SampleCheckRequest"
                - $ref: "#/components/schemas/FitnessCheckRequest"
            examples:
              match:
                value:
                  description: Heart disease cohort with cardiology encounters
              sampleCheck:
                summary: Sample check
                value:
                  sampleCheck: ds_cardio_synthea_v1
                  description: Heart disease cohort with cardiology encounters
      responses:
        "200":
          description: Ranked matches, or a sample-check verdict.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MatchResponse"
                  - $ref: "#/components/schemas/SampleCheckResponse"
                  - $ref: "#/components/schemas/FitnessCheckResponse"
              examples:
                matches:
                  value:
                    matches:
                      - datasetId: ds_cardio_synthea_v1
                        score: 2
                        rationale: "Matched on: cardiology, cohort"
                        title: Synthetic Cardiology Cohort (Synthea)
                        priceCents: 4900
                        recordCount: 10000
                      - datasetId: ds_diabetes_synthea_v1
                        score: 1
                        rationale: "Matched on: cohort"
                        title: Synthetic Type 2 Diabetes Cohort (Synthea)
                        priceCents: 5900
                        recordCount: 8000
                    source: keyword
                sampleCheck:
                  summary: Sample check verdict
                  value:
                    sampleCheck:
                      passed: true
                      score: 92
                      findings:
                        - All sampled records are synthetic (Synthea)
                        - No direct identifiers in sampled columns
                      source: rules
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/orders:
    get:
      security: [{ sessionCookie: [] }]
      tags: [Orders]
      operationId: getOrders
      summary: List orders, read one order, or summarize earnings
      description: |
        Reads orders from the DB (no PayPal). The query string picks the shape:

        - no `id` / `summary` → `{ orders: OrderRow[] }` (newest first),
          optionally AND-filtered by `status`, `datasetId`, `buyerEmail`.
        - `?id=ord_..` → `{ order, authorization, delivery }`; add `&events=1` for
          `{ order, authorization, delivery, events }` (the audit timeline, oldest
          first). `authorization` is the PayPal hold window while funds are held,
          and null otherwise. `delivery` is a short-lived download link, only once
          the buyer may have the data (DELIVERED, CAPTURED or PAID_OUT); it is
          minted fresh on every read with a 900 second lifetime, and null
          otherwise. 404 if unknown.
        - `?id=ord_..&receipt=1` → `{ order, receipt, dua }`, the fee breakdown,
          the order's query cap and its data use agreement.
        - `?summary=1[&datasetId=..]` → `{ summary: OrderSummary }`, the vendor
          earnings roll-up. `paidOutCents` is gross; for PAID_OUT orders,
          `vendorPaidOutCents` is what the vendor received after the platform fee,
          and `platformFeeCents` is the fee withheld.
      parameters:
        - name: id
          in: query
          description: Return a single order by id.
          schema:
            {
              type: string,
              examples: [ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f],
            }
        - name: receipt
          in: query
          description:
            With `id`, return the order's receipt (any value). Money fields are
            0 for a VOIDED or CANCELLED order.
          schema: { type: string, examples: ["1"] }
        - name: arbitrate
          in: query
          description:
            With `id` of a DISPUTED order, return `{ order, recommendation }`,
            an advisory outcome (refund, release, split or needs_human) with
            confidence, rationale and evidence. Never moves money; 409 if the
            order is not DISPUTED.
          schema: { type: string, examples: ["1"] }
        - name: events
          in: query
          description: With `id`, also return the order's audit events (any value).
          schema: { type: string, examples: ["1"] }
        - name: audit
          in: query
          description: With `id`, return only `{ audit }`, the order's stored delivery audit, or null if the listing was not audited (any value).
          schema: { type: string, examples: ["1"] }
        - name: summary
          in: query
          description: Return the earnings summary instead of rows (any value).
          schema: { type: string, examples: ["1"] }
        - name: status
          in: query
          description: Filter the list by escrow state.
          schema:
            $ref: "#/components/schemas/EscrowState"
        - name: datasetId
          in: query
          description: Filter the list (or scope the summary) to one dataset.
          schema: { type: string, examples: [ds_cardio_synthea_v1] }
        - name: buyerEmail
          in: query
          description: Filter the list by buyer email.
          schema: { type: string, format: email }
      responses:
        "200":
          description: Orders, one order (with optional events), or a summary.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrderListResponse"
                  - $ref: "#/components/schemas/OrderDetailResponse"
                  - $ref: "#/components/schemas/OrderSummaryResponse"
                  - $ref: "#/components/schemas/OrderReceiptResponse"
                  - $ref: "#/components/schemas/OrderArbitrationResponse"
              examples:
                list:
                  value:
                    orders:
                      - id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                        dataset_id: ds_cardio_synthea_v1
                        buyer_email: demo-buyer@meddata.test
                        paypal_order_id: MOCK-ORDER-a1b2c3d4
                        authorization_id: MOCK-AUTH-e5f6a7b8
                        status: DELIVERED
                        amount_cents: 4900
                        query_cap_cents: 1000
                        created_at: "2026-10-21 17:02:11"
                        updated_at: "2026-10-21 17:03:40"
                one:
                  value:
                    order:
                      id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                      dataset_id: ds_cardio_synthea_v1
                      buyer_email: demo-buyer@meddata.test
                      paypal_order_id: MOCK-ORDER-a1b2c3d4
                      authorization_id: MOCK-AUTH-e5f6a7b8
                      status: DELIVERED
                      amount_cents: 4900
                      query_cap_cents: 1000
                      created_at: "2026-10-21 17:02:11"
                      updated_at: "2026-10-21 17:03:40"
                    authorization:
                      authorizedAt: "2026-10-21T17:02:30.000Z"
                      honorUntil: "2026-10-24T17:02:30.000Z"
                      expiresAt: "2026-11-19T17:02:30.000Z"
                      state: valid
                      daysLeft: 21
                    events:
                      - id: evt_0c6d6f7e-1a2b-4c3d-8e9f-001122334455
                        order_id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                        seq: 0
                        event: CREATE
                        from_state: null
                        to_state: MATCHED
                        note: null
                        created_at: "2026-10-21 17:02:11"
                      - id: evt_1d7e8f90-2b3c-4d5e-9f00-112233445566
                        order_id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                        seq: 1
                        event: AUTHORIZE
                        from_state: MATCHED
                        to_state: AUTHORIZED
                        note: null
                        created_at: "2026-10-21 17:02:30"
                summary:
                  value:
                    summary:
                      countsByStatus:
                        MATCHED: 1
                        AUTHORIZED: 0
                        DELIVERED: 1
                        CAPTURED: 0
                        PAID_OUT: 2
                        DISPUTED: 0
                        VOIDED: 1
                        CANCELLED: 0
                      heldCents: 4900
                      capturedCents: 10800
                      paidOutCents: 10800
                      vendorPaidOutCents: 9720
                      platformFeeCents: 1080
                      releasedCents: 4900
                receipt:
                  summary: Receipt for a delivered order with two query charges
                  value:
                    order:
                      id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                      dataset_id: ds_cardio_synthea_v1
                      buyer_email: demo-buyer@meddata.test
                      paypal_order_id: MOCK-ORDER-a1b2c3d4
                      authorization_id: MOCK-AUTH-e5f6a7b8
                      status: DELIVERED
                      amount_cents: 4900
                      query_cap_cents: 1000
                      created_at: "2026-10-21 17:02:11"
                      updated_at: "2026-10-21 17:03:40"
                    receipt:
                      orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                      datasetId: ds_cardio_synthea_v1
                      status: DELIVERED
                      amountCents: 4900
                      platformFeeCents: 490
                      vendorPayoutCents: 4410
                      queryCount: 2
                      queryChargesCents: 100
                      queryCapCents: 1000
                      totalCents: 5000
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`arbitrate` was requested for an order that is not DISPUTED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unknown `status` filter value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badStatus:
                  value: { error: "unknown status: SHIPPED" }
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      security: [{ sessionCookie: [] }]
      tags: [Orders]
      operationId: createOrder
      summary: Create an escrow order at the listed price
      description: |
        Creates a PayPal Orders v2 order (`intent=AUTHORIZE`) and an `orders`
        row in state `MATCHED`. The escrowed amount is **always** the dataset's
        listed price; an optional `amount` (major units) is only a confirmation,
        and a mismatch is 422. In mock mode no PayPal call is made, but the row
        is still persisted with a `MOCK-ORDER-*` id.

        If the same buyer already has an unapproved (`MATCHED`) order for this
        dataset at the current price, that order is returned instead of a new
        one, with `reused: true` and status 200. An order left at an old price
        (the vendor repriced since) is not reused. An order is reused only when
        its query cap matches a `queryCapCents` the caller sent; leaving
        `queryCapCents` out reuses an unapproved order at the current price
        whatever its cap. In mock mode the approve link is the relative path
        `/checkout/mock?token=..&orderId=..`.

        Each order stores its query spend cap (`queryCapCents`, default 1000
        cents, $10.00), which `POST /api/query` and `POST /api/billing` enforce.
        In live mode the PayPal order also carries our order id as `custom_id`,
        a description, and `experience_context` return and cancel URLs
        (`/researcher?orderId=..`). The base URL is `NEXT_PUBLIC_SITE_URL`, or the
        request's origin when that is unset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            examples:
              create:
                value:
                  datasetId: ds_cardio_synthea_v1
                  amount: 49
                  buyerEmail: researcher@example.edu
      responses:
        "200":
          description:
            "An existing unapproved order for this buyer and dataset was
            returned (`reused: true`); no PayPal call was made."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
              examples:
                reused:
                  value:
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    paypalOrderId: MOCK-ORDER-a1b2c3d4
                    status: CREATED
                    approveUrl: /checkout/mock?token=MOCK-ORDER-a1b2c3d4&orderId=ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    escrowState: MATCHED
                    reused: true
                    mock: true
        "201":
          description: Order created; escrow state `MATCHED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
              examples:
                mock:
                  value:
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    paypalOrderId: MOCK-ORDER-a1b2c3d4
                    status: CREATED
                    approveUrl: /checkout/mock?token=MOCK-ORDER-a1b2c3d4&orderId=ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    escrowState: MATCHED
                    mock: true
        "422":
          description:
            Missing or unknown `datasetId`, invalid `amount`, an `amount` that
            does not match the listed price, or a `queryCapCents` that is not an
            integer from 50 to 100000.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                priceMismatch:
                  value: { error: amount does not match the listed price }
                unknownDataset:
                  value: { error: "unknown datasetId: ds_nope" }
                badQueryCap:
                  value:
                    {
                      error: "queryCapCents, if provided, must be an integer from 50 to 100000",
                    }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PayPalNotConfigured"
        default:
          $ref: "#/components/responses/PayPalFailure"
    patch:
      security: [{ sessionCookie: [] }]
      tags: [Orders]
      operationId: advanceOrder
      summary: Advance an order through the escrow state machine
      description: |
        Actions map to escrow events: `authorize` (MATCHED → AUTHORIZED),
        `deliver` (AUTHORIZED → DELIVERED), `capture` (DELIVERED → CAPTURED),
        `payout` (CAPTURED → PAID_OUT), `void` (AUTHORIZED → VOIDED),
        `dispute` (AUTHORIZED/DELIVERED → DISPUTED), `cancel` (MATCHED →
        CANCELLED, the buyer backing out before approving; no PayPal call, since
        nothing was held), and `resolve` with `resolution: capture | void`
        (DISPUTED → CAPTURED | VOIDED). Only the side giving in can settle a
        dispute: the buyer resolves with `capture` (drops it and pays), the
        vendor resolves with `void` (refunds the buyer). Any other pairing is
        a 403.

        A dispute can also settle for part of the price, which takes both
        sides. `propose_split` with `captureCents` (what the vendor keeps)
        records an offer and moves no money; a new offer replaces the last one.
        The other side accepts with `resolve`, `resolution: split` and the same
        `captureCents`. PayPal captures that part and releases the rest, and the
        order's `amount_cents` becomes the captured amount. Accepting your own
        offer, or a figure that is no longer the offer, is a 409.

        In live mode, `payout` sends the vendor's share (the price minus the
        platform fee) through the PayPal Payouts API to the vendor's payout
        email, and a vendor without one gets a 409.

        The stored row is the source of truth for the current state and PayPal
        ids. The transition is validated **before** any PayPal call, so an
        illegal move never charges anyone and never writes (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceOrderRequest"
            examples:
              authorize:
                value:
                  {
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f,
                    action: authorize,
                  }
              dispute:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  action: dispute
                  note: Delivered file is missing the medications table
              cancel:
                summary: Buyer backs out before approving in PayPal
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  action: cancel
              resolve:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  action: resolve
                  resolution: void
                  note: Vendor could not supply the missing table
      responses:
        "200":
          description: Escrow advanced; the new state plus any PayPal id produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvanceOrderResponse"
              examples:
                authorized:
                  value:
                    escrowState: AUTHORIZED
                    authorizationId: MOCK-AUTH-e5f6a7b8
                    status: COMPLETED
                    mock: true
                delivered:
                  value: { escrowState: DELIVERED, mock: true }
                captured:
                  value:
                    escrowState: CAPTURED
                    captureId: MOCK-CAP-9a8b7c6d
                    status: COMPLETED
                    mock: true
                paidOut:
                  value:
                    escrowState: PAID_OUT
                    payoutBatchId: MOCK-PAYOUT-1f2e3d4c
                    status: PENDING
                    mock: true
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description:
            Illegal transition from the order's current state, or the order
            lacks the PayPal id the action needs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                illegal:
                  value:
                    {
                      error: "Invalid escrow transition: CAPTURE not allowed from MATCHED",
                    }
                noAuthorization:
                  value: { error: order has no authorization to capture }
                cancelAfterApproval:
                  value:
                    {
                      error: "Invalid escrow transition: CANCEL not allowed from AUTHORIZED",
                    }
        "422":
          description:
            Unknown `action`, missing `orderId`, or `resolve` without a valid
            `resolution`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badAction:
                  value:
                    error:
                      "action must be one of: authorize, deliver, capture, payout, void,
                      dispute, cancel, resolve"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PayPalNotConfigured"
        default:
          $ref: "#/components/responses/PayPalFailure"

  /api/query:
    post:
      security: [{ sessionCookie: [] }]
      tags: [Query]
      operationId: runQuery
      summary: Ask a plain-English question of a purchased dataset
      description: |
        Requires an order for this dataset in `DELIVERED`, `CAPTURED` or
        `PAID_OUT`. The question is screened for identifiers and row-level asks,
        compiled to parameterized aggregate-only SQL, re-checked, executed
        vendor-side (mocked), and put through small-cell suppression (k ≥ 11).
        Only answered queries are metered, at the server-set per-query fee, in
        our own ledger (not PayPal). If one more query would take the order past
        its `queryCapCents`, the answer is `402` before any privacy check runs,
        and nothing is metered.

        Send `analysis` instead of `question` for a Kaplan-Meier survival answer
        on a SYNTHETIC fixture listing. It is metered the same way. Grouping comes
        from a fixed list and filters are refused with `422`. Curves sit on a
        3-month grid and at-risk counts are rounded to the nearest 5. A group
        under the floor is withheld along with the next smallest group, so
        subtraction cannot reveal it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              avgAgeBySex:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  datasetId: ds_cardio_synthea_v1
                  question: average age by sex
              survivalByArm:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  datasetId: ds_als_survival_axonpoint_v1
                  analysis: { type: survival, groupBy: arm }
      responses:
        "200":
          description: Aggregate answer, with the usage row it was billed as.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              examples:
                answered:
                  value:
                    datasetId: ds_cardio_synthea_v1
                    question: average age by sex
                    compiled:
                      sql:
                        'SELECT sex AS "group", AVG(age) AS avg_age FROM records WHERE dataset_id =
                        ? GROUP BY sex'
                      params: [ds_cardio_synthea_v1]
                    result:
                      - { group: female, avg_age: 77 }
                      - { group: male, avg_age: 60 }
                    summary: The average age by sex ranges from 60 (male) to 77 (female).
                    usage:
                      usageId: qu_5b6c7d8e-9f01-4a2b-8c3d-4e5f60718293
                      chargeCents: 50
        "403":
          description:
            Order does not grant data access, or the question/SQL/result was
            rejected by the privacy guard (`reasons` explains why). When a safe
            aggregate rephrasing exists, `suggestion` carries it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                pii:
                  value:
                    error: query rejected
                    reasons:
                      - 'Question mentions a PII/identifier field: "name".'
                      - 'Question mentions a PII/identifier field: "ssn".'
                withSuggestion:
                  summary: Refused question with a safe rewrite
                  value:
                    error: query rejected
                    reasons:
                      - 'Question mentions a PII/identifier field: "zip".'
                    suggestion: How many patients are there by region?
                noAccess:
                  value:
                    {
                      error: order does not grant data access (status AUTHORIZED),
                    }
        "402":
          description:
            The order's query spend cap is reached; one more query would exceed
            `queryCapCents`. Nothing is metered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryCapReached"
              examples:
                capReached:
                  value:
                    error: query spend cap reached for this order
                    spentCents: 1000
                    capCents: 1000
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description:
            Missing fields, question longer than 500 characters, or the order
            is for a different dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    {
                      error: "orderId, datasetId and question (non-empty strings) are required",
                    }
        "500":
          description: The order could not be loaded or usage could not be recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                usage:
                  value: { error: could not record query usage }

  /api/billing:
    get:
      security: [{ sessionCookie: [] }]
      tags: [Billing]
      operationId: getBilling
      summary: An order's per-query usage and spend
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            {
              type: string,
              examples: [ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f],
            }
      responses:
        "200":
          description: Usage rows (newest first) with count and total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingResponse"
              examples:
                billed:
                  value:
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    usage:
                      - id: qu_5b6c7d8e-9f01-4a2b-8c3d-4e5f60718293
                        order_id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                        question: average age by sex
                        charge_cents: 50
                        created_at: "2026-10-21 17:04:02"
                    queryCount: 1
                    totalCents: 50
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      security: [{ sessionCookie: [] }]
      tags: [Billing]
      operationId: recordUsage
      summary: Record one per-query charge
      description: |
        Records a usage row at the server-set fee (`PER_QUERY_FEE_CENTS`, 50).
        `chargeCents` is accepted only as a confirmation; any other value is
        422. The order must grant data access, otherwise 409. If the charge
        would take the order past its `queryCapCents`, it is refused with 402
        and nothing is recorded. This is where a real PayPal per-query capture
        would fire (mocked).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUsageRequest"
            examples:
              charge:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  question: count by region
                  chargeCents: 50
      responses:
        "201":
          description: Usage recorded and charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordUsageResponse"
              examples:
                charged:
                  value:
                    usageId: qu_6c7d8e9f-0a1b-4c2d-9e3f-50617283a4b5
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    chargeCents: 50
                    charged: true
        "402":
          description: The order's query spend cap is reached. Nothing is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryCapReached"
              examples:
                capReached:
                  value:
                    error: query spend cap reached for this order
                    spentCents: 1000
                    capCents: 1000
        "409":
          description: The order's escrow state does not grant data access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notDelivered:
                  value:
                    {
                      error:
                        "order is AUTHORIZED; queries are billable only once data access is
                        granted",
                    }
        "422":
          description:
            Missing fields, unknown order, or a `chargeCents` that differs from
            the server fee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrongFee:
                  value:
                    {
                      error: "chargeCents is set by the server (per-query fee is 50)",
                    }

  /api/agent:
    get:
      security: [{ sessionCookie: [] }]
      tags: [Agent]
      operationId: getAgentRun
      summary: Read a stored agent run (audit trail)
      description: |
        Every POST /api/agent run is saved before the response is sent: the
        study, budget, planner, the escrow order it opened (if any), the full
        tool-call trace including refusals, and the agent's reasoning.
      parameters:
        - name: runId
          in: query
          required: true
          description: The `runId` returned by POST /api/agent.
          schema:
            {
              type: string,
              examples: [run_7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b],
            }
      responses:
        "200":
          description: The stored run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
              examples:
                run:
                  value:
                    runId: run_7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    study: Outcomes of statin therapy in adults with coronary heart disease
                    budgetCents: 6000
                    source: scripted
                    orderId: ord_3f9c2a1e
                    steps:
                      - tool: search_datasets
                        input:
                          { study: statin therapy in coronary heart disease }
                        output: { matches: 2 }
                        at: "2026-10-21T18:02:11.000Z"
                    recommendation:
                      datasetId: ds_cardio_synthea_v1
                      reasoning: Best match within budget; sample check passed
                    shortlist:
                      - datasetId: ds_cardio_synthea_v1
                        title: Synthetic Cardiology Cohort (Synthea)
                        priceCents: 4900
                        fitScore: 2
                        sampleCheck: passed
                        withinBudget: true
                        reason: "Chosen, the best fit that cleared every check."
                        chosen: true
                    createdAt: "2026-10-21 18:02:12"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      security: [{ sessionCookie: [] }]
      tags: [Agent]
      operationId: runProcurementAgent
      summary: Run the AI procurement agent
      description: |
        Agentic commerce: given a study and a budget, the agent searches the
        catalog, inspects datasets, sample-checks a candidate, and only then
        opens a PayPal escrow order (MATCHED + approve URL). Funds are held only
        after the buyer approves in PayPal; the agent never authorizes or
        captures.

        Claude on Amazon Bedrock drives the tool loop when
        `LLM_PROVIDER=bedrock`; otherwise a deterministic scripted planner runs
        the same tools (`source` says which). Guardrails are enforced in code,
        not the prompt: price must fit `budgetCents`, a passing sample check for
        that dataset must come first, at most 3 sample checks run per run, a
        dataset the buyer already owns is never bought again, and at most one
        order is created per run. `search_datasets` and `get_dataset` results
        carry `alreadyOwned` (true when an AUTHORIZED, DELIVERED, CAPTURED,
        PAID_OUT or DISPUTED order already covers the dataset). When a sample
        fails, the scripted planner moves on to the next in-budget candidate.
        A refused call is recorded in `steps` with its `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
            examples:
              run:
                value:
                  study: Outcomes of statin therapy in adults with coronary heart disease
                  budgetCents: 6000
                  buyerEmail: researcher@university.edu
      responses:
        "200":
          description: Agent run trace, recommendation and the ranked shortlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
              examples:
                run:
                  value:
                    runId: run_7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    steps:
                      - tool: search_datasets
                        input:
                          { study: statin therapy in coronary heart disease }
                        output: { matches: 2 }
                        at: "2026-10-21T18:02:11.000Z"
                      - tool: check_sample
                        input: { datasetId: ds_cardio_synthea_v1 }
                        output: { passed: true, score: 97 }
                        at: "2026-10-21T18:02:11.000Z"
                      - tool: create_escrow_order
                        input:
                          {
                            datasetId: ds_cardio_synthea_v1,
                            justification: Best fit within budget,
                          }
                        output: { orderId: ord_3f9c2a1e, escrowState: MATCHED }
                        at: "2026-10-21T18:02:12.000Z"
                    recommendation:
                      datasetId: ds_cardio_synthea_v1
                      reasoning: Best match within budget; sample check passed
                    shortlist:
                      - datasetId: ds_cardio_synthea_v1
                        title: Synthetic Cardiology Cohort (Synthea)
                        priceCents: 4900
                        fitScore: 2
                        sampleCheck: passed
                        withinBudget: true
                        reason: "Chosen, the best fit that cleared every check."
                        chosen: true
                      - datasetId: ds_diabetes_synthea_v1
                        title: Synthetic Type 2 Diabetes Cohort (Synthea)
                        priceCents: 5900
                        fitScore: 1
                        sampleCheck: not_run
                        withinBudget: true
                        reason: "Matched on: cohort"
                        chosen: false
                    order:
                      orderId: ord_3f9c2a1e
                      datasetId: ds_cardio_synthea_v1
                      approveUrl: /checkout/mock?token=MOCK-ORDER-a1b2c3d4&orderId=ord_3f9c2a1e
                      escrowState: MATCHED
                      amountCents: 4900
                    source: scripted
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: The `mandate` token is invalid, tampered with or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited (5 agent runs per minute per client).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mandates:
    get:
      tags: [Mandates]
      operationId: listMandates
      summary: List the caller's spending mandates
      description: |
        Newest first, each with what it has spent, what is left and whether it
        is `active`, `expired` or `revoked`. The token itself is never stored,
        so it is not returned here.
      responses:
        "200":
          description: The caller's mandates.
          content:
            application/json:
              schema:
                type: object
                required: [mandates]
                properties:
                  mandates:
                    type: array
                    items:
                      $ref: "#/components/schemas/MandateSummary"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - sessionCookie: []
    delete:
      tags: [Mandates]
      operationId: revokeMandate
      summary: Revoke a spending mandate
      description: |
        Kill switch. The agent and the MCP server stop opening orders under this
        mandate right away, even with a valid token. Repeating the call changes
        nothing. Orders it already opened stay, and only the buyer can approve
        those.
      parameters:
        - name: mandateId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The mandate, now revoked.
          content:
            application/json:
              schema:
                type: object
                required: [mandate]
                properties:
                  mandate:
                    $ref: "#/components/schemas/MandateSummary"
        "404":
          description: The mandate does not exist or belongs to someone else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - sessionCookie: []
    post:
      tags: [Mandates]
      operationId: issueMandate
      summary: Issue a signed spending mandate
      description: |
        Agentic commerce guardrail. A mandate is a buyer policy (total cap,
        per-order cap, optional vendor and tag allow-lists, expiry) signed with
        HMAC-SHA256 under a server secret. Pass the returned `token` as
        `mandate` to `POST /api/agent`, or to the MCP `place_escrow_order`
        tool: the buy path refuses any order outside it, in code. Tampering
        with the token invalidates its signature. Spend is reserved in the
        database before PayPal is called, so it survives a restart and holds
        across concurrent runs. A voided or cancelled order gives its budget
        back.

        Demo scope: issuance is unauthenticated; production would gate it
        behind buyer login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandateRequest"
            examples:
              cardiologyOnly:
                value:
                  maxTotalCents: 10000
                  maxPerOrderCents: 6000
                  allowedTags: [cardiology]
      responses:
        "200":
          description: The signed token and the mandate it encodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateIssued"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - sessionCookie: []

  /api/datasets:
    get:
      security: [{ sessionCookie: [] }]
      tags: [Catalog]
      operationId: listDatasets
      summary: List catalog datasets with their current prices
      description: |
        Returns every listed dataset with the price stored in the database,
        which is the price escrow orders charge.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                required: [datasets]
                properties:
                  datasets:
                    type: array
                    items: { $ref: "#/components/schemas/Dataset" }
              examples:
                catalog:
                  value:
                    datasets:
                      - id: ds_cardio_synthea_v1
                        vendorId: vnd_demo_health
                        title: Synthetic Cardiology Cohort (Synthea)
                        description: Synthetic patients with cardiovascular conditions.
                        priceCents: 4900
                        recordCount: 10000
                        tags: [cardiology, synthetic, synthea]
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      security: [{ sessionCookie: [] }]
      tags: [Catalog]
      operationId: updateDatasetPrice
      summary: Change a dataset's listing price
      description: |
        Vendors reprice a listing. The price must be a whole number of cents
        between $1.00 (`100`) and $10,000.00 (`1000000`). The new price is what
        the next `POST /api/orders` escrows and what `POST /api/match` shows.
        Orders that already exist keep the amount they were created with.

        Checks run in this order: body shape and field types (400), then the
        price range and whole cents (422), then the dataset lookup (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datasetId, priceCents]
              properties:
                datasetId: { type: string, minLength: 1 }
                priceCents:
                  type: integer
                  minimum: 100
                  maximum: 1000000
                  description: Whole cents, `100` to `1000000`.
            examples:
              reprice:
                value: { datasetId: ds_cardio_synthea_v1, priceCents: 5400 }
      responses:
        "200":
          description: The updated dataset.
          content:
            application/json:
              schema:
                type: object
                required: [dataset]
                properties:
                  dataset: { $ref: "#/components/schemas/Dataset" }
              examples:
                repriced:
                  value:
                    dataset:
                      id: ds_cardio_synthea_v1
                      vendorId: vnd_demo_health
                      title: Synthetic Cardiology Cohort (Synthea)
                      description: Synthetic patients with cardiovascular conditions.
                      priceCents: 5400
                      recordCount: 10000
                      tags: [cardiology, synthetic, synthea]
        "400":
          description:
            The body is not a JSON object, `datasetId` is not a non-empty
            string, or `priceCents` is not a number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notNumber:
                  value: { error: "priceCents (number) is required" }
        "404":
          description: No dataset has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownDataset:
                  value: { error: "unknown dataset: ds_nope" }
        "422":
          description:
            "`priceCents` is not a whole number of cents, or is outside $1.00
            to $10,000.00."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                outOfRange:
                  value:
                    error: "priceCents must be between 100 ($1.00) and 1000000 ($10,000.00)"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      security:
        - sessionCookie: []
      tags:
        - Catalog
      operationId: publishProviderDataset
      summary: Publish a synthetic cohort from an owned live PostgreSQL source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - connectionId
                - datasetKey
                - title
                - description
                - priceCents
                - synthetic
              properties:
                connectionId:
                  type: string
                datasetKey:
                  type: string
                title:
                  type: string
                description:
                  type: string
                priceCents:
                  type: integer
                  minimum: 100
                  maximum: 1000000
                synthetic:
                  const: true
      responses:
        "201":
          description: Dataset created with a live cohort count.
        "400":
          description: Invalid connection or dataset configuration.
        "401":
          description: Sign in required.
        "403":
          description: Completed provider account and permitted host required.

  /api/trust:
    get:
      tags: [Catalog]
      operationId: getTrust
      summary: Explainable trust scores for vendors and datasets
      description: |
        A 0-100 score with a letter grade and five weighted factors (sample
        check pass rate, dispute rate, dispute outcomes, delivery speed, order
        volume), each with a plain-English reason. Rates are shrunk toward a
        neutral prior so tiny histories never look perfect. Pass `vendorId` or
        `datasetId` for one subject; pass neither to list all.
      parameters:
        - {
            name: vendorId,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: datasetId,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description:
            One subject's trust (`vendorId` or `datasetId` mode) or the full
            list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendorId: { type: string }
                  datasetId: { type: string }
                  name: { type: string }
                  title: { type: string }
                  trust: { $ref: "#/components/schemas/TrustScore" }
                  vendors:
                    type: array
                    items: { type: object }
