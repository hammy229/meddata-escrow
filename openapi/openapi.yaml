          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Both `vendorId` and `datasetId` were given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - sessionCookie: []

  /api/demo/reset:
    post:
      tags: [System]
      operationId: resetDemo
      summary: Shared demo reset is disabled
      description: Disabled to prevent erasing other accounts' orders.
      responses:
        "403":
          description: Global reset is unavailable over HTTP.

  /api/insights:
    get:
      tags: [System]
      operationId: getInsights
      summary: Marketplace insights roll-up
      description: |
        Aggregates every order, audit event and query charge. Money is bucketed
        by escrow state: `heldCents` is AUTHORIZED, DELIVERED and DISPUTED;
        `releasedCents` is CAPTURED and PAID_OUT; `refundedCents` is VOIDED.
        `gmvCents` is held plus released. `platformFeeCents` is earned only on
        released orders. `disputeRate` is orders ever disputed over orders ever
        authorized. `avgTimeToDeliverHours` is null until an order is delivered.
        An empty book returns zeros. Never cached.
      responses:
        "200":
          description: The roll-up.
          content:
            application/json:
              schema:
                type: object
                required: [insights]
                properties:
                  insights:
                    type: object
                    required:
                      - orderCount
                      - gmvCents
                      - heldCents
                      - releasedCents
                      - refundedCents
                      - platformFeeCents
                      - disputeRate
                      - avgTimeToDeliverHours
                      - queryCount
                      - queryRevenueCents
                      - byStatus
                      - topDatasets
                      - byVendor
                    properties:
                      orderCount: { type: integer }
                      gmvCents: { type: integer }
                      heldCents: { type: integer }
                      releasedCents: { type: integer }
                      refundedCents: { type: integer }
                      platformFeeCents: { type: integer }
                      disputeRate: { type: number, minimum: 0, maximum: 1 }
                      avgTimeToDeliverHours: { type: [number, "null"] }
                      queryCount: { type: integer }
                      queryRevenueCents: { type: integer }
                      byStatus:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { $ref: "#/components/schemas/EscrowState" }
                            count: { type: integer }
                            amountCents: { type: integer }
                      topDatasets:
                        type: array
                        items:
                          type: object
                          properties:
                            datasetId: { type: string }
                            title: { type: string }
                            vendorName: { type: string }
                            orders: { type: integer }
                            gmvCents: { type: integer }
                            queries: { type: integer }
                            queryCents: { type: integer }
                      byVendor:
                        type: array
                        items:
                          type: object
                          properties:
                            vendorId: { type: string }
                            name: { type: string }
                            orders: { type: integer }
                            gmvCents: { type: integer }
                            heldCents: { type: integer }
                            releasedCents: { type: integer }
                            feeCents: { type: integer }
                            netCents: { type: integer }
                            disputes: { type: integer }
              examples:
                empty:
                  value:
                    insights:
                      orderCount: 0
                      gmvCents: 0
                      heldCents: 0
                      releasedCents: 0
                      refundedCents: 0
                      platformFeeCents: 0
                      disputeRate: 0
                      avgTimeToDeliverHours: null
                      queryCount: 0
                      queryRevenueCents: 0
                      byStatus: []
                      topDatasets: []
                      byVendor: []
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - sessionCookie: []

  /api/webhooks/paypal:
    post:
      tags: [Webhooks]
      operationId: receivePaypalWebhook
      summary: Receive a PayPal webhook event
      description: |
        PayPal posts payment events here. The raw body is verified with PayPal's
        `verify-webhook-signature` (headers `paypal-transmission-*`,
        `paypal-cert-url`, `paypal-auth-algo`; webhook id `PAYPAL_WEBHOOK_ID`)
        before it is trusted.

        An event is matched to an order by the ids on its resource (the resource
        id and the related authorization and PayPal order ids), and by our own
        order id, which we send as `custom_id` when the PayPal order is created.

        Every event id is recorded in the same transaction as any state change,
        so redeliveries are no-ops (`duplicate`). An event is applied only when
        its escrow transition is legal from the order's current state; anything
        else is acknowledged as `ignored` with a reason. After verification the
        answer is always 200 so PayPal does not retry forever; only an
        unexpected internal failure returns 500 (and the retry is safe).

        Demo only: with `PAYPAL_MODE=mock`, an event is accepted iff it carries
        the header `x-mock-webhook: 1`.
      parameters:
        - { name: paypal-transmission-id, in: header, schema: { type: string } }
        - {
            name: paypal-transmission-time,
            in: header,
            schema: { type: string },
          }
        - {
            name: paypal-transmission-sig,
            in: header,
            schema: { type: string },
          }
        - { name: paypal-cert-url, in: header, schema: { type: string } }
        - { name: paypal-auth-algo, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaypalWebhookEvent"
            examples:
              captureCompleted:
                value:
                  id: WH-58D329510W468432D-8HN650336L201105X
                  event_type: PAYMENT.CAPTURE.COMPLETED
                  resource_type: capture
                  resource: { id: 2GG279541U471931P, status: COMPLETED }
      responses:
        "200":
          description: Event verified (applied, recorded, duplicate, or ignored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
              examples:
                applied:
                  value:
                    {
                      received: true,
                      applied: VOID,
                      orderId: ord_3f2c9a1e,
                      escrowState: VOIDED,
                    }
                recorded:
                  value:
                    {
                      received: true,
                      recorded: true,
                      orderId: ord_3f2c9a1e,
                      escrowState: CAPTURED,
                    }
                duplicate:
                  value: { duplicate: true }
                ignored:
                  value:
                    {
                      ignored: true,
                      reason: "transition not legal from current state",
                    }
        "500":
          $ref: "#/components/responses/InternalError"
        "401":
          description: Webhook signature verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/connections:
    get:
      security: &a1
        - sessionCookie: []
      tags: &a2
        - Catalog
      operationId: listProviderConnections
      summary: List owned database connections without credentials
      responses:
        "200":
          description: Connection metadata; secrets are never returned.
        "400": &a3
          description: Invalid connection or dataset configuration.
        "401": &a4
          description: Sign in required.
        "403": &a5
          description: Completed provider account and permitted host required.
    post:
      security: *a1
      tags: *a2
      operationId: saveProviderConnection
      summary:
        Test and save an encrypted PostgreSQL source, or retest an existing
        source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                connectionString:
                  type: string
                  writeOnly: true
                schemaName:
                  type: string
                  default: public
                tableName:
                  type: string
                  default: research_records
                caCert:
                  type: string
                  writeOnly: true
                action:
                  type: string
                  enum:
                    - test
                connectionId:
                  type: string
      responses:
        "200":
          description: Existing connection passed its read-only view test.
        "201":
          description: Connection tested, encrypted and saved.
        "400": *a3
        "401": *a4
        "403": *a5
        "429":
          description: Too many connection attempts.
    delete:
      security: *a1
      tags: *a2
      operationId: deleteProviderConnection
      summary: Remove an owned connection that has no published datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - connectionId
              properties:
                connectionId:
                  type: string
      responses:
        "200":
          description: Unused connection removed.
        "400": *a3
        "401": *a4
        "403": *a5
  /api/demo/session/{...path}:
    get:
      tags:
        - System
      operationId: readWalkthroughStep
      summary: Run an isolated mock walkthrough step
      description: Opaque browser session cookie scopes all reads and writes to
        temporary synthetic demo data. Reset cannot affect the authenticated app
        database. Available only in PAYPAL_MODE=mock.
      parameters:
        - name: ...path
          in: path
          required: true
          schema:
            type: string
            enum:
              - reset
              - match
              - orders
              - query
      responses:
        "200":
          description: Step response.
        "401":
          description: Start the walkthrough first.
        "404":
          description: Unknown step or mock mode disabled.
        "429":
          description: Too many walkthrough requests.
    post:
      tags:
        - System
      operationId: runWalkthroughStep
      summary: Run an isolated mock walkthrough step
      description: Opaque browser session cookie scopes all reads and writes to
        temporary synthetic demo data. Reset cannot affect the authenticated app
        database. Available only in PAYPAL_MODE=mock.
      parameters:
        - name: ...path
          in: path
          required: true
          schema:
            type: string
            enum:
              - reset
              - match
              - orders
              - query
      responses:
        "200":
          description: Step response.
        "401":
          description: Start the walkthrough first.
        "404":
          description: Unknown step or mock mode disabled.
        "422":
          description: Reset body is not empty, `{}` or `{"seed":"story"}`.
        "429":
          description: Too many walkthrough requests.
    patch:
      tags:
        - System
      operationId: advanceWalkthroughOrder
      summary: Run an isolated mock walkthrough step
      description: Opaque browser session cookie scopes all reads and writes to
        temporary synthetic demo data. Reset cannot affect the authenticated app
        database. Available only in PAYPAL_MODE=mock.
      parameters:
        - name: ...path
          in: path
          required: true
          schema:
            type: string
            enum:
              - reset
              - match
              - orders
              - query
      responses:
        "200":
          description: Step response.
        "401":
          description: Start the walkthrough first.
        "404":
          description: Unknown step or mock mode disabled.
        "429":
          description: Too many walkthrough requests.

components:
  securitySchemes:
    sweepSecret:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: meddata_session
  schemas:
    EscrowState:
      type: string
      description:
        Escrow lifecycle state. `PAID_OUT`, `VOIDED` and `CANCELLED` are
        terminal.
      enum:
        [
          MATCHED,
          AUTHORIZED,
          DELIVERED,
          CAPTURED,
          PAID_OUT,
          DISPUTED,
          VOIDED,
          CANCELLED,
        ]
    TrustScore:
      type: object
      required: [score, grade, factors]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        grade: { type: string, enum: [A, B, C, D, F] }
        factors:
          type: array
          items:
            type: object
            required: [key, label, weight, value, points, reason]
            properties:
              key:
                type: string
                enum:
                  [
                    sampleChecks,
                    disputeRate,
                    disputeOutcomes,
                    deliverySpeed,
                    volume,
                  ]
              label: { type: string }
              weight: { type: number }
              value: { type: number, minimum: 0, maximum: 1 }
              points: { type: number }
              reason: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        reasons:
          type: array
          description: Present on privacy-guard rejections.
          items: { type: string }
    HealthResponse:
      type: object
      required: [status, mode, db]
      properties:
        status: { type: string, enum: [ok, error] }
        mode: { type: string, enum: [mock, live] }
        db: { type: string, enum: [ok, error] }
    OrderRow:
      type: object
      description: A persisted order row (snake_case, as stored).
      required:
        [
          id,
          dataset_id,
          buyer_email,
          paypal_order_id,
          authorization_id,
          status,
          amount_cents,
          query_cap_cents,
          created_at,
          updated_at,
        ]
      properties:
        id:
          { type: string, examples: [ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f] }
        dataset_id: { type: string }
        buyer_email: { type: string }
        paypal_order_id: { type: [string, "null"] }
        authorization_id: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EscrowState" }
        amount_cents:
          {
            type: integer,
            description: Escrowed amount; always the listed price.,
          }
        query_cap_cents:
          {
            type: integer,
            description:
              Most the buyer can be metered for queries on this order (cents).
              Defaults to 1000.,
          }
        created_at:
          {
            type: string,
            description: "SQLite timestamp, `YYYY-MM-DD HH:MM:SS` UTC.",
          }
        updated_at: { type: [string, "null"] }
    OrderEventRow:
      type: object
      description: One audit-trail row per lifecycle transition (append-only).
      required:
        [id, order_id, seq, event, from_state, to_state, note, created_at]
      properties:
        id: { type: string }
        order_id: { type: string }
        seq:
          {
            type: integer,
            description: Monotonic per-order position; 0 is the genesis row.,
          }
        event:
          type: string
          description: "`CREATE` for the genesis row, otherwise the escrow event."
          enum:
            [
              CREATE,
              AUTHORIZE,
              DELIVER,
              CAPTURE,
              PAYOUT,
              DISPUTE,
              RESOLVE_CAPTURE,
              RESOLVE_VOID,
              VOID,
              CANCEL,
            ]
        from_state:
          oneOf:
            - $ref: "#/components/schemas/EscrowState"
            - type: "null"
        to_state: { $ref: "#/components/schemas/EscrowState" }
        note:
          {
            type: [string, "null"],
            description: Dispute reason or resolution note.,
          }
        created_at: { type: string }
    UsageRow:
      type: object
      required: [id, order_id, question, charge_cents, created_at]
      properties:
        id:
          { type: string, examples: [qu_5b6c7d8e-9f01-4a2b-8c3d-4e5f60718293] }
        order_id: { type: string }
        question: { type: string }
        charge_cents: { type: integer }
        created_at: { type: string }
    OrderSummary:
      type: object
      description: Vendor earnings roll-up. Every escrow state is present in
        `countsByStatus` (zero-filled).
      required:
        [
          countsByStatus,
          heldCents,
          capturedCents,
          paidOutCents,
          vendorPaidOutCents,
          platformFeeCents,
          releasedCents,
        ]
      properties:
        countsByStatus:
          type: object
          required:
            [
              MATCHED,
              AUTHORIZED,
              DELIVERED,
              CAPTURED,
              PAID_OUT,
              DISPUTED,
              VOIDED,
              CANCELLED,
            ]
          properties:
            MATCHED: { type: integer }
            AUTHORIZED: { type: integer }
            DELIVERED: { type: integer }
            CAPTURED: { type: integer }
            PAID_OUT: { type: integer }
            DISPUTED: { type: integer }
            VOIDED: { type: integer }
            CANCELLED: { type: integer }
        heldCents:
          { type: integer, description: AUTHORIZED + DELIVERED + DISPUTED. }
        capturedCents: { type: integer, description: CAPTURED + PAID_OUT. }
        paidOutCents: { type: integer, description: PAID_OUT (gross). }
        vendorPaidOutCents:
          {
            type: integer,
            description: What the vendor received for PAID_OUT orders,
            after the platform fee.,
          }
        platformFeeCents:
          {
            type: integer,
            description:
              Platform fee withheld from PAID_OUT orders. vendorPaidOutCents +
              platformFeeCents = paidOutCents.,
          }
        releasedCents: { type: integer, description: VOIDED. }
    MatchRequest:
      type: object
      required: [description]
      properties:
        description:
          {
            type: string,
            minLength: 1,
            description: Plain-English study description.,
          }
    FitnessCheckRequest:
      type: object
      required: [fitnessCheck]
      properties:
        fitnessCheck: { type: string, description: Dataset id. }
        description: { type: string }
    FitnessFinding:
      type: object
      required: [id, severity, title, reason]
      properties:
        id:
          type: string
          description: Which check produced this, for example claim, leak_impact or drift. New ids can appear.
        severity: { type: string, enum: [pass, warn, fail, info] }
        column: { type: string }
        title: { type: string }
        reason: { type: string }
        metric:
          type: object
          additionalProperties: { type: [string, number] }
    FitnessReport:
      type: object
      required:
        [
          datasetId,
          stage,
          synthetic,
          verdict,
          findings,
          disclaimer,
          methodVersion,
        ]
      properties:
        datasetId: { type: string }
        stage: { type: string, enum: [sample, delivery] }
        synthetic: { type: boolean }
        verdict: { type: string, enum: [pass, warn, fail, not_applicable] }
        findings:
          type: array
          items: { $ref: "#/components/schemas/FitnessFinding" }
        disclaimer: { type: string }
        methodVersion: { type: integer }
    FitnessCheckResponse:
      type: object
      required: [fitnessCheck]
      properties:
        fitnessCheck:
          oneOf:
            - $ref: "#/components/schemas/FitnessReport"
            - type: "null"
    SampleCheckRequest:
      type: object
      required: [sampleCheck]
      properties:
        sampleCheck:
          {
            type: string,
            minLength: 1,
            description: Dataset id to sample-check.,
          }
        description:
          { type: string, description: Optional study description for context. }
    Dataset:
      type: object
      description:
        A catalog listing. `priceCents` is the database price, the amount
        escrow orders charge.
      required:
        [id, vendorId, title, description, priceCents, recordCount, tags]
      properties:
        id: { type: string }
        vendorId: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        priceCents:
          type: integer
          description: Listed price in cents (the amount POST /api/orders escrows).
        recordCount:
          type: [integer, "null"]
          description: Records in the dataset; null if not listed.
        tags: { type: array, items: { type: string } }
    DatasetMatch:
      type: object
      required: [datasetId, score, rationale, title, priceCents, recordCount]
      properties:
        datasetId: { type: string }
        score: { type: number }
        rationale: { type: string }
        title: { type: [string, "null"] }
        priceCents:
          type: [integer, "null"]
          description: The database price (what an order charges).
        recordCount:
          type: [integer, "null"]
          description: Records in the dataset, from the catalog; null if not listed.
        source: { type: string, enum: [llm, keyword] }
        relevant:
          type: boolean
          description: Offline matches only. False when the score is too weak to act on, and the agent will not buy on it.
    MatchResponse:
      type: object
      required: [matches, source]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/DatasetMatch" }
        source:
          type: string
          enum: [llm, keyword]
          description: Whether the ranking came from the model or the keyword fallback.
    SampleCheckResponse:
      type: object
      required: [sampleCheck]
      properties:
        sampleCheck:
          type: object
          required: [passed, score, findings, source]
          properties:
            passed: { type: boolean }
            score: { type: number, minimum: 0, maximum: 100 }
            findings:
              type: array
              items: { type: string }
            source: { type: string, enum: [llm, rules] }
    OrderListResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/OrderRow" }
    OrderDetailResponse:
      type: object
      required: [order, authorization, delivery]
      properties:
        order: { $ref: "#/components/schemas/OrderRow" }
        deadline:
          description:
            What happens if nobody acts. Delivered data releases the payment
            and an undelivered hold is refunded. Null in every other state.
          oneOf:
            - type: object
              required: [action, dueAt, daysLeft]
              properties:
                action: { type: string, enum: [release, refund] }
                dueAt: { type: string, format: date-time }
                daysLeft: { type: integer }
            - type: "null"
        authorization:
          description:
            The PayPal hold window while funds are held (AUTHORIZED, DELIVERED,
            DISPUTED); null otherwise.
          oneOf:
            - $ref: "#/components/schemas/AuthorizationWindow"
            - type: "null"
        delivery:
          description:
            A fresh download link, only once the buyer may have the data
            (DELIVERED, CAPTURED, PAID_OUT); null otherwise.
          oneOf:
            - $ref: "#/components/schemas/DeliveryLink"
            - type: "null"
        events:
          type: array
          description: Present when `events` is passed; oldest first.
          items: { $ref: "#/components/schemas/OrderEventRow" }
    DeliveryLink:
      type: object
      description:
        "A short-lived download link for the order's dataset, minted on
        every read. For now it is always a mock link on a local-only host (mock
        is true); the S3 presigned URL is not wired yet."
      required: [url, expiresAt, mock]
      properties:
        url: { type: string, format: uri }
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working (900 seconds after the read).
        mock: { type: boolean, const: true }
    AuthorizationWindow:
      type: object
      description:
        How long a PayPal authorization (the buyer's held funds) can still
        be captured. Measured from the AUTHORIZE event. Honored for 3 days,
        valid for up to 29.
      required: [authorizedAt, honorUntil, expiresAt, state, daysLeft]
      properties:
        authorizedAt: { type: string, format: date-time }
        honorUntil:
          type: string
          format: date-time
          description:
            End of the 3-day honor period. PayPal guarantees the funds until
            then.
        expiresAt:
          type: string
          format: date-time
          description:
            End of the 29-day validity period. After this the hold must be
            reauthorized.
        state:
          type: string
          enum: [honor, valid, expired]
          description: Where `now` falls in the window.
        daysLeft:
          type: integer
          minimum: 0
          description: Whole days left until `expiresAt`, rounded up; 0 once expired.
    OrderReceiptResponse:
      type: object
      required: [order, receipt]
      properties:
        order: { $ref: "#/components/schemas/OrderRow" }
        receipt: { $ref: "#/components/schemas/Receipt" }
        dua:
          type: object
          description:
            Plain-text data use agreement for the order (permitted use, no
            re-identification, aggregate-only, retention) and the SHA-256 hex
            fingerprint of that exact text.
          required: [text, sha256]
          properties:
            text: { type: string }
            sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    OrderArbitrationResponse:
      type: object
      required: [order, recommendation]
      properties:
        order: { $ref: "#/components/schemas/OrderRow" }
        recommendation:
          type: object
          description:
            Advisory only. The arbiter never moves money; confidence below 0.6
            is forced to `needs_human`.
          required:
            [outcome, confidence, rationale, evidence, source, advisoryOnly]
          properties:
            outcome:
              type: string
              enum: [refund, release, split, needs_human]
            confidence: { type: number, minimum: 0, maximum: 1 }
            rationale: { type: string }
            evidence:
              type: array
              items: { type: string }
            source: { type: string, enum: [llm, rules] }
            suggestedCaptureCents:
              type: integer
              description: With outcome `split`, a starting figure for what the vendor keeps.
            advisoryOnly: { type: boolean, enum: [true] }
    Receipt:
      type: object
      description:
        What the buyer paid and how it splits between vendor and platform.
        `platformFeeCents + vendorPayoutCents = amountCents`. VOIDED and
        CANCELLED orders are all zeros for money.
      required:
        [
          orderId,
          datasetId,
          status,
          amountCents,
          platformFeeCents,
          vendorPayoutCents,
          queryCount,
          queryChargesCents,
          queryCapCents,
          totalCents,
        ]
      properties:
        orderId: { type: string }
        datasetId: { type: string }
        status: { $ref: "#/components/schemas/EscrowState" }
        amountCents:
          type: integer
          description:
            The escrowed price (the captured amount once captured). 0 for
            VOIDED or CANCELLED.
        platformFeeCents:
          { type: integer, description: Platform share of amountCents (10%). }
        vendorPayoutCents:
          { type: integer, description: amountCents minus platformFeeCents. }
        refundedCents:
          {
            type: integer,
            description: What a split dispute sent back to the buyer.,
          }
        queryCount:
          type: integer
          description: Queries run against the order, including any on a voided order.
        queryChargesCents:
          {
            type: integer,
            description: Sum of the per-query charges. 0 for VOIDED or CANCELLED.,
          }
        queryCapCents:
          {
            type: integer,
            description: The most the buyer can be metered for queries on this order.,
          }
        totalCents:
          { type: integer, description: amountCents + queryChargesCents. }
    OrderSummaryResponse:
      type: object
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/OrderSummary" }
    CreateOrderRequest:
      type: object
      required: [datasetId]
      properties:
        datasetId: { type: string }
        amount:
          type: number
          exclusiveMinimum: 0
          description:
            Optional confirmation of the listed price, in major units (e.g. 49
            for $49.00).
        currency:
          {
            type: string,
            description: ISO currency code (live mode only). Defaults to USD.,
          }
        referenceId:
          {
            type: string,
            description: PayPal purchase-unit reference (live mode only).,
          }
        buyerEmail:
          { type: string, description: Defaults to demo-buyer@meddata.test. }
        queryCapCents:
          {
            type: integer,
            minimum: 50,
            maximum: 100000,
            default: 1000,
            description:
              "Spend cap on metered queries for this order, in cents (50 to
              100000). Defaults to 1000. When sent, an existing unapproved order
              is reused only if its cap matches.",
          }
    CreateOrderResponse:
      type: object
      required: [orderId, paypalOrderId, status, approveUrl, escrowState]
      properties:
        orderId: { type: string }
        paypalOrderId: { type: string }
        status:
          { type: string, description: PayPal order status (e.g. CREATED). }
        approveUrl:
          type: string
          format: uri-reference
          description:
            PayPal's approval link, or the relative `/checkout/mock` page in
            mock mode.
        escrowState: { $ref: "#/components/schemas/EscrowState" }
        reused:
          type: boolean
          const: true
          description:
            Present (true) when an existing unapproved order was returned
            instead of a new one.
        mock: { type: boolean, description: Present (true) in mock mode. }
    DemoResetRequest:
      type: object
      description: Optional. Omit the body (or send `{}`) for a plain reset.
      properties:
        seed:
          type: string
          enum: [story]
          description: "`story` adds the six sample orders after the reset."
    AdvanceOrderRequest:
      type: object
      required: [orderId, action]
      properties:
        orderId: { type: string }
        action:
          type: string
          enum:
            [
              authorize,
              deliver,
              capture,
              payout,
              void,
              dispute,
              cancel,
              resolve,
              propose_split,
            ]
        resolution:
          type: string
          enum: [capture, void, split]
          description: Required when `action` is `resolve`.
        captureCents:
          type: integer
          description: >-
            What the vendor keeps, in cents. Required for `propose_split` and
            for `resolve` with `resolution: split`, where it must match the
            current offer.
        requestId:
          {
            type: string,
            description: PayPal idempotency key for capture (live mode).,
          }
        note:
          {
            type: string,
            maxLength: 500,
            description: "Recorded on the audit event (trimmed, capped at 500 chars).",
          }
    AdvanceOrderResponse:
      type: object
      required: [escrowState]
      properties:
        escrowState: { $ref: "#/components/schemas/EscrowState" }
        audit:
          type: object
          description: Present after `deliver` on a listing that makes claims. Only a failed claim sets `blocking`, which moves the order to DISPUTED.
          required: [verdict, blocking]
          properties:
            verdict:
              {
                type: string,
                enum: [pass, warn, fail, inconclusive, not_applicable],
              }
            blocking: { type: boolean }
        authorizationId:
          { type: string, description: Present after `authorize`. }
        captureId:
          {
            type: string,
            description: Present after `capture` or `resolve` (capture).,
          }
        payoutBatchId:
          { type: string, description: Present after `payout` (mock mode). }
        status: { type: string, description: PayPal status of the money move. }
        mock: { type: boolean }
    CompiledQuery:
      type: object
      required: [sql, params]
      properties:
        sql: { type: string, description: "Parameterized, aggregate-only SQL." }
        params:
          type: array
          items: {}
    QueryCapReached:
      type: object
      description: A 402 from a query or billing call whose order has spent its cap.
      required: [error, spentCents, capCents]
      properties:
        error: { type: string }
        spentCents:
          type: integer
          description: Metered so far on the order (cents).
        capCents:
          type: integer
          description: The order's query spend cap (cents).
    QueryRequest:
      type: object
      required: [orderId, datasetId]
      description: Send either `question` or `analysis`.
      properties:
        orderId: { type: string }
        datasetId: { type: string }
        question: { type: string, minLength: 1, maxLength: 500 }
        analysis:
          type: object
          additionalProperties: false
          required: [type, groupBy]
          properties:
            type: { type: string, enum: [survival] }
            groupBy: { type: string, enum: [arm, sex, onset_site, age_band] }
    QueryResponse:
      type: object
      required: [datasetId, question, execution, summary, usage]
      description: A question answer has `compiled` and `result`. A survival answer has `analysis`.
      properties:
        datasetId: { type: string }
        question: { type: string }
        compiled: { $ref: "#/components/schemas/CompiledQuery" }
        result:
          type: array
          description:
            Aggregate rows only; every count is at or above the small-cell
            threshold.
          items:
            type: object
            additionalProperties:
              type: [string, number]
        summary:
          type: string
          description:
            One plain sentence describing the result. It never quotes a cell
            below the small-cell threshold. Claude may reword it; a number guard
            falls back to the rule-based wording if the model adds a figure the
            rows do not contain.
        execution:
          type: string
          enum: [postgres, mock, fixture]
          description:
            Where the aggregate ran. `postgres` is the vendor's live connected
            database, `mock` is the bundled synthetic data, and `fixture` is a
            seeded SYNTHETIC cohort.
        analysis:
          type: object
          description: The survival answer. Curves, medians and p-values only, never rows or exact event times.
          required:
            [
              type,
              groupBy,
              synthetic,
              label,
              unit,
              grid,
              groups,
              withheldGroups,
              logRank,
              interpretation,
            ]
          properties:
            type: { type: string, enum: [survival] }
            groupBy: { type: string }
            synthetic: { type: boolean }
            label: { type: string }
            unit: { type: string, enum: [months] }
            grid: { type: array, items: { type: integer } }
            groups:
              type: array
              items:
                type: object
                required: [group, curve, medianMonths, truncatedAtMonth]
                properties:
                  group: { type: string }
                  curve:
                    type: array
                    items:
                      type: object
                      required: [month, survival, atRisk]
                      properties:
                        month: { type: integer }
                        survival: { type: number }
                        atRisk: { type: integer }
                  medianMonths: { type: [integer, "null"] }
                  truncatedAtMonth: { type: [integer, "null"] }
            withheldGroups: { type: integer }
            logRank:
              type: object
              description: Raw, and for the arm grouping also stratified by age band.
              additionalProperties: true
            interpretation: { type: string }
        usage:
          type: object
          required: [usageId, chargeCents]
          properties:
            usageId: { type: string }
            chargeCents: { type: integer }
    BillingResponse:
      type: object
      required: [orderId, usage, queryCount, totalCents]
      properties:
        orderId: { type: string }
        usage:
          type: array
          items: { $ref: "#/components/schemas/UsageRow" }
        queryCount: { type: integer }
        totalCents: { type: integer }
    RecordUsageRequest:
      type: object
      required: [orderId, question]
      properties:
        orderId: { type: string }
        question: { type: string, minLength: 1 }
        chargeCents:
          {
            type: integer,
            const: 50,
            description: Optional confirmation of the server fee.,
          }
    RecordUsageResponse:
      type: object
      required: [usageId, orderId, chargeCents, charged]
      properties:
        usageId: { type: string }
        orderId: { type: string }
        chargeCents: { type: integer }
        charged: { type: boolean }
    AgentRequest:
      type: object
      required: [study, budgetCents]
      properties:
        study:
          type: string
          minLength: 1
          maxLength: 1000
          description: Plain-English study description.
        budgetCents:
          type: integer
          minimum: 1
          description: Hard spending cap; enforced in code.
        buyerEmail:
          type: string
          format: email
        mandate:
          type: string
          maxLength: 4096
          description:
            Signed spending mandate token from `POST /api/mandates`. Orders
            outside it are refused in code.
    MandateSummary:
      type: object
      required:
        [
          id,
          buyerId,
          maxTotalCents,
          maxPerOrderCents,
          spentCents,
          remainingCents,
          status,
          expiresAt,
          revokedAt,
          createdAt,
        ]
      properties:
        id: { type: string }
        buyerId: { type: string }
        maxTotalCents: { type: integer }
        maxPerOrderCents: { type: integer }
        allowedVendors: { type: array, items: { type: string } }
        allowedTags: { type: array, items: { type: string } }
        spentCents: { type: integer }
        remainingCents: { type: integer }
        status: { type: string, enum: [active, expired, revoked] }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"] }
        createdAt: { type: string }
    AgentStep:
      type: object
      required: [tool, input, at]
      properties:
        tool:
          type: string
          enum:
            [search_datasets, get_dataset, check_sample, create_escrow_order]
        input: { type: object, additionalProperties: true }
        output: { description: Tool result (absent when the call errored). }
        error:
          { type: string, description: Why the call was refused or failed. }
        at: { type: string, format: date-time }
    AgentResponse:
      type: object
      required: [runId, steps, recommendation, shortlist, source]
      properties:
        runId: { type: string }
        steps:
          type: array
          description: Ordered trace of every tool call, including refusals.
          items: { $ref: "#/components/schemas/AgentStep" }
        recommendation:
          type: object
          required: [datasetId, reasoning]
          properties:
            datasetId:
              type: [string, "null"]
              description: The dataset ordered, or null if nothing was bought.
            reasoning: { type: string }
        shortlist:
          type: array
          description:
            Candidates the run considered, best first. The chosen dataset (if
            any) is ranked first.
          items: { $ref: "#/components/schemas/ShortlistItem" }
        order:
          type: object
          description: Present when the agent opened an escrow order.
          required: [orderId, datasetId, approveUrl, escrowState, amountCents]
          properties:
            orderId: { type: string }
            datasetId: { type: string }
            approveUrl:
              type: string
              format: uri-reference
              description:
                Absolute PayPal link, or a relative `/checkout/mock` link in mock
                mode.
            escrowState: { $ref: "#/components/schemas/EscrowState" }
            amountCents: { type: integer }
        mandate:
          type: object
          description:
            Present when the request carried a mandate. Spend is per mandate
            across runs (per server process).
          required: [id, maxTotalCents, spentCents, remainingCents, denied]
          properties:
            id: { type: string }
            maxTotalCents: { type: integer }
            spentCents: { type: integer }
            remainingCents: { type: integer }
            denied:
              type: array
              description: Why the mandate refused orders in this run.
              items: { type: string }
        source: { type: string, enum: [llm, scripted] }
    MandateRequest:
      type: object
      additionalProperties: false
      required: [maxTotalCents]
      properties:
        maxTotalCents: { type: integer, minimum: 1 }
        maxPerOrderCents:
          type: integer
          minimum: 1
          description: Defaults to maxTotalCents; may not exceed it.
        allowedVendors:
          type: array
          minItems: 1
          items: { type: string }
        allowedTags:
          type: array
          minItems: 1
          description: A dataset needs at least one of these tags.
          items: { type: string }
        buyerId:
          type: string
          description: Defaults to the demo buyer.
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future. Defaults to one hour from now.
    Mandate:
      type: object
      required:
        [id, buyerId, maxTotalCents, maxPerOrderCents, issuedAt, expiresAt]
      properties:
        id: { type: string }
        buyerId: { type: string }
        maxTotalCents: { type: integer }
        maxPerOrderCents: { type: integer }
        allowedVendors: { type: array, items: { type: string } }
        allowedTags: { type: array, items: { type: string } }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    MandateIssued:
      type: object
      required: [token, mandate]
      properties:
        token:
          type: string
          description: "`base64url(mandate json).base64url(hmac-sha256)`."
        mandate: { $ref: "#/components/schemas/Mandate" }
    ShortlistItem:
      type: object
      description:
        One candidate in an agent run's shortlist. Derived from the run's
        recorded steps, so older runs get one too.
      required:
        [
          datasetId,
          title,
          priceCents,
          fitScore,
          sampleCheck,
          withinBudget,
          reason,
          chosen,
        ]
      properties:
        datasetId: { type: string }
        title: { type: [string, "null"] }
        priceCents: { type: [integer, "null"] }
        fitScore:
          type: [number, "null"]
          description:
            Relevance score from the search step; null if the dataset was never
            searched.
        sampleCheck: { type: string, enum: [passed, failed, not_run] }
        withinBudget:
          type: [boolean, "null"]
          description: Whether the price fits `budgetCents`; null when the price is unknown.
        reason:
          type: string
          maxLength: 140
          description: One short sentence on why the candidate ranks where it does.
        chosen:
          type: boolean
          description: True for the dataset the run recommended or opened an order for.
    AgentRun:
      type: object
      description: A persisted agent run (agent_runs audit table).
      required:
        [
          runId,
          study,
          budgetCents,
          source,
          orderId,
          steps,
          recommendation,
          shortlist,
          createdAt,
        ]
      properties:
        runId: { type: string }
        study: { type: string }
        budgetCents: { type: integer }
        source: { type: string, enum: [llm, scripted] }
        orderId:
          type: [string, "null"]
          description: The escrow order the run opened, or null.
        steps:
          type: array
          items: { $ref: "#/components/schemas/AgentStep" }
        recommendation:
          type: [object, "null"]
          required: [datasetId, reasoning]
          properties:
            datasetId: { type: [string, "null"] }
            reasoning: { type: string }
        shortlist:
          type: array
          description: Ranked candidates, best first (rebuilt from the stored steps).
          items: { $ref: "#/components/schemas/ShortlistItem" }
        createdAt:
          type: string
          description: SQLite CURRENT_TIMESTAMP (UTC, "YYYY-MM-DD HH:MM:SS").
    PaypalWebhookEvent:
      type: object
      required: [id, event_type, resource]
      properties:
        id: { type: string }
        event_type:
          {
            type: string,
            examples: [PAYMENT.CAPTURE.COMPLETED, PAYMENT.AUTHORIZATION.VOIDED],
          }
        resource_type: { type: string }
        resource:
          type: object
          additionalProperties: true
    WebhookAck:
      type: object
      properties:
        received: { type: boolean }
        applied:
          type: string
          description: The escrow event applied (e.g. VOID, DISPUTE).
        recorded:
          { type: boolean, description: Relevant event, no state change. }
        orderId: { type: string }
        escrowState: { $ref: "#/components/schemas/EscrowState" }
        duplicate:
          { type: boolean, description: The event id was already processed. }
        ignored:
          {
            type: boolean,
            description: Unknown type,
            no matching order,
            or illegal transition.,
          }
        reason: { type: string }
  responses:
    ValidationError:
      description: Invalid or missing request fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              value: { error: "description (non-empty string) is required" }
    NotFound:
      description: Unknown order id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unknownOrder:
              value: { error: "unknown orderId: ord_missing" }
    InternalError:
      description: Unexpected server error (details are logged, never returned).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internal:
              value: { error: internal error }
    PayPalNotConfigured:
      description:
        Live mode without PayPal credentials (set PAYPAL_MODE=mock or fill
        .env.local).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notConfigured:
              value: { error: PayPal not configured (see .env.example) }
    PayPalFailure:
      description: A PayPal API call failed; the status mirrors PayPal's response status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            paypal:
              value: { error: PayPal request failed }
