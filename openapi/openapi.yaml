openapi: 3.1.0
info:
  title: MedData Escrow API
  version: 0.3.0
  summary: Escrowed marketplace for synthetic medical datasets, settled with PayPal.
  description: |
    MedData Escrow lets a researcher describe a study in plain English, match it
    to vendor datasets, and buy access through an **escrow** built on PayPal
    authorize-then-capture. Funds are held (authorized) while the data is
    delivered, captured once the buyer accepts it, and paid out to the vendor.
    A buyer can dispute while funds are held, and an operator resolves the
    dispute toward capture or void.

    After delivery the researcher asks plain-English questions. Each question is
    screened for identifiers, compiled to aggregate-only SQL, re-checked, run
    vendor-side, put through small-cell suppression, and billed per answer at a
    server-set fee.

    **All data is synthetic** (Synthea-generated cohorts). No real patient data
    is stored or returned.

    The server, not the client, decides who pays what and who sees what:
    the escrowed amount is always the dataset's listed price, queries require a
    paid and delivered order, and the per-query fee is fixed server-side.

    Errors are always `{ "error": string }`, plus `reasons: string[]` on
    privacy rejections.

    Run with `PAYPAL_MODE=mock` to drive the whole escrow arc with no PayPal
    credentials; responses then carry `mock: true` and `MOCK-*` ids. In mock
    mode the approve link is a local page (`/checkout/mock`), and
    `POST /api/demo/reset` starts the demo over.
  license:
    name: MIT
    identifier: MIT
security: []
servers:
  - url: http://localhost:3000
    description: Local dev server (`npm run dev` or `npm run dev:mock`)
tags:
  - name: System
    description: Health and API metadata.
  - name: Catalog
    description: Dataset listings and vendor pricing.
  - name: Matching
    description: Rank catalog datasets against a study description.
  - name: Orders
    description: Escrow lifecycle (PayPal authorize-then-capture) and order reads.
  - name: Query
    description: Privacy-safe, metered plain-English queries over a purchased dataset.
  - name: Billing
    description: Per-query usage and spend.
  - name: Agent
    description: AI procurement agent that plans a purchase end to end.
  - name: Webhooks
    description: Inbound PayPal webhook events.
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and readiness probe
      description: |
        Runs a trivial `SELECT 1` through the normal DB path. Reports the
        PayPal mode only as `mock` or `live`; no credentials, paths, or error
        details are ever echoed. Never cached.
      responses:
        "200":
          description: Database reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value: { status: ok, mode: mock, db: ok }
        "503":
          description: Database could not be opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                dbDown:
                  value: { status: error, mode: live, db: error }

  /api/openapi:
    get:
      tags: [System]
      operationId: getOpenApiSpec
      summary: This OpenAPI document
      description: |
        Serves `openapi/openapi.yaml`: parsed to JSON by default, or the raw
        YAML with `?format=yaml`. Point Postman or APIMatic at this URL to
        import the API.
      parameters:
        - name: format
          in: query
          description: "`yaml` returns the file verbatim; anything else returns JSON."
          schema:
            type: string
            enum: [json, yaml]
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
                description: OpenAPI 3.1 document.
                additionalProperties: true
              examples:
                spec:
                  value:
                    openapi: 3.1.0
                    info: { title: MedData Escrow API, version: 0.3.0 }
            application/yaml:
              schema:
                type: string

  /api/match:
    post:
      tags: [Matching]
      operationId: matchDatasets
      summary: Rank datasets for a study description
      description: |
        Returns catalog datasets ranked by relevance to a plain-English study
        description, each enriched with its catalog title, its listed price and
        its record count. The price is the one stored in the database, which is
        what an order charges, so a vendor's repricing shows up here at once.

        When `LLM_PROVIDER=bedrock`, Claude on Amazon Bedrock ranks the catalog;
        otherwise (or if the model call fails) a deterministic keyword matcher
        does. `source` says which (`llm` | `keyword`), per response and per match.

        The body may instead be `{ "sampleCheck": datasetId, "description"? }` to
        run the pre-purchase sample quality check on one dataset. The check can
        only tighten: the model's verdict is AND-ed with deterministic rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MatchRequest"
                - $ref: "#/components/schemas/SampleCheckRequest"
            examples:
              match:
                value:
                  description: Heart disease cohort with cardiology encounters
              sampleCheck:
                summary: Sample check
                value:
                  sampleCheck: ds_cardio_synthea_v1
                  description: Heart disease cohort with cardiology encounters
      responses:
        "200":
          description: Ranked matches, or a sample-check verdict.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MatchResponse"
                  - $ref: "#/components/schemas/SampleCheckResponse"
              examples:
                matches:
                  value:
                    matches:
                      - datasetId: ds_cardio_synthea_v1
                        score: 2
                        rationale: "Matched on: cardiology, cohort"
                        title: Synthetic Cardiology Cohort (Synthea)
                        priceCents: 4900
                        recordCount: 10000
                      - datasetId: ds_diabetes_synthea_v1
                        score: 1
                        rationale: "Matched on: cohort"
                        title: Synthetic Type 2 Diabetes Cohort (Synthea)
                        priceCents: 5900
                        recordCount: 8000
                    source: keyword
                sampleCheck:
                  summary: Sample check verdict
                  value:
                    sampleCheck:
                      passed: true
                      score: 92
                      findings:
                        - All sampled records are synthetic (Synthea)
                        - No direct identifiers in sampled columns
                      source: rules
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/orders:
    get:
      tags: [Orders]
      operationId: getOrders
      summary: List orders, read one order, or summarize earnings
      description: |
        Reads orders from the DB (no PayPal). The query string picks the shape:

        - no `id` / `summary` → `{ orders: OrderRow[] }` (newest first),
          optionally AND-filtered by `status`, `datasetId`, `buyerEmail`.
        - `?id=ord_..` → `{ order, authorization }`; add `&events=1` for
          `{ order, authorization, events }` (the audit timeline, oldest first).
          `authorization` is the PayPal hold window while funds are held, and
          null otherwise. 404 if unknown.
        - `?id=ord_..&receipt=1` → `{ order, receipt }`, the fee breakdown.
        - `?summary=1[&datasetId=..]` → `{ summary: OrderSummary }`, the vendor
          earnings roll-up.
      parameters:
        - name: id
          in: query
          description: Return a single order by id.
          schema:
            {
              type: string,
              examples: [ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f],
            }
        - name: receipt
          in: query
          description: With `id`, return the order's receipt (any value). Money fields are 0 for a VOIDED or CANCELLED order.
          schema: { type: string, examples: ["1"] }
        - name: events
          in: query
          description: With `id`, also return the order's audit events (any value).
          schema: { type: string, examples: ["1"] }
        - name: summary
          in: query
          description: Return the earnings summary instead of rows (any value).
          schema: { type: string, examples: ["1"] }
        - name: status
          in: query
          description: Filter the list by escrow state.
          schema:
            $ref: "#/components/schemas/EscrowState"
        - name: datasetId
          in: query
          description: Filter the list (or scope the summary) to one dataset.
          schema: { type: string, examples: [ds_cardio_synthea_v1] }
        - name: buyerEmail
          in: query
          description: Filter the list by buyer email.
          schema: { type: string, format: email }
      responses:
        "200":
          description: Orders, one order (with optional events), or a summary.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrderListResponse"
                  - $ref: "#/components/schemas/OrderDetailResponse"
                  - $ref: "#/components/schemas/OrderSummaryResponse"
                  - $ref: "#/components/schemas/OrderReceiptResponse"
              examples:
                list:
                  value:
                    orders:
                      - id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                        dataset_id: ds_cardio_synthea_v1
                        buyer_email: demo-buyer@meddata.test
                        paypal_order_id: MOCK-ORDER-a1b2c3d4
                        authorization_id: MOCK-AUTH-e5f6a7b8
                        status: DELIVERED
                        amount_cents: 4900
                        created_at: "2026-10-21 17:02:11"
                        updated_at: "2026-10-21 17:03:40"
                one:
                  value:
                    order:
                      id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                      dataset_id: ds_cardio_synthea_v1
                      buyer_email: demo-buyer@meddata.test
                      paypal_order_id: MOCK-ORDER-a1b2c3d4
                      authorization_id: MOCK-AUTH-e5f6a7b8
                      status: DELIVERED
                      amount_cents: 4900
                      created_at: "2026-10-21 17:02:11"
                      updated_at: "2026-10-21 17:03:40"
                    authorization:
                      authorizedAt: "2026-10-21T17:02:30.000Z"
                      honorUntil: "2026-10-24T17:02:30.000Z"
                      expiresAt: "2026-11-19T17:02:30.000Z"
                      state: valid
                      daysLeft: 21
                    events:
                      - id: evt_0c6d6f7e-1a2b-4c3d-8e9f-001122334455
                        order_id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                        seq: 0
                        event: CREATE
                        from_state: null
                        to_state: MATCHED
                        note: null
                        created_at: "2026-10-21 17:02:11"
                      - id: evt_1d7e8f90-2b3c-4d5e-9f00-112233445566
                        order_id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                        seq: 1
                        event: AUTHORIZE
                        from_state: MATCHED
                        to_state: AUTHORIZED
                        note: null
                        created_at: "2026-10-21 17:02:30"
                summary:
                  value:
                    summary:
                      countsByStatus:
                        MATCHED: 1
                        AUTHORIZED: 0
                        DELIVERED: 1
                        CAPTURED: 0
                        PAID_OUT: 2
                        DISPUTED: 0
                        VOIDED: 1
                        CANCELLED: 0
                      heldCents: 4900
                      capturedCents: 10800
                      paidOutCents: 10800
                      releasedCents: 4900
                receipt:
                  summary: Receipt for a delivered order with two query charges
                  value:
                    order:
                      id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                      dataset_id: ds_cardio_synthea_v1
                      buyer_email: demo-buyer@meddata.test
                      paypal_order_id: MOCK-ORDER-a1b2c3d4
                      authorization_id: MOCK-AUTH-e5f6a7b8
                      status: DELIVERED
                      amount_cents: 4900
                      created_at: "2026-10-21 17:02:11"
                      updated_at: "2026-10-21 17:03:40"
                    receipt:
                      orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                      datasetId: ds_cardio_synthea_v1
                      status: DELIVERED
                      amountCents: 4900
                      platformFeeCents: 490
                      vendorPayoutCents: 4410
                      queryCount: 2
                      queryChargesCents: 100
                      totalCents: 5000
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Unknown `status` filter value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badStatus:
                  value: { error: "unknown status: SHIPPED" }
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an escrow order at the listed price
      description: |
        Creates a PayPal Orders v2 order (`intent=AUTHORIZE`) and an `orders`
        row in state `MATCHED`. The escrowed amount is **always** the dataset's
        listed price; an optional `amount` (major units) is only a confirmation,
        and a mismatch is 422. In mock mode no PayPal call is made, but the row
        is still persisted with a `MOCK-ORDER-*` id.

        If the same buyer already has an unapproved (`MATCHED`) order for this
        dataset at the current price, that order is returned instead of a new
        one, with `reused: true` and status 200. An order left at an old price
        (the vendor repriced since) is not reused. In mock mode the approve link
        is the relative path `/checkout/mock?token=..&orderId=..`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            examples:
              create:
                value:
                  datasetId: ds_cardio_synthea_v1
                  amount: 49
                  buyerEmail: researcher@example.edu
      responses:
        "200":
          description: "An existing unapproved order for this buyer and dataset was returned (`reused: true`); no PayPal call was made."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
              examples:
                reused:
                  value:
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    paypalOrderId: MOCK-ORDER-a1b2c3d4
                    status: CREATED
                    approveUrl: /checkout/mock?token=MOCK-ORDER-a1b2c3d4&orderId=ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    escrowState: MATCHED
                    reused: true
                    mock: true
        "201":
          description: Order created; escrow state `MATCHED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
              examples:
                mock:
                  value:
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    paypalOrderId: MOCK-ORDER-a1b2c3d4
                    status: CREATED
                    approveUrl: /checkout/mock?token=MOCK-ORDER-a1b2c3d4&orderId=ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    escrowState: MATCHED
                    mock: true
        "422":
          description: Missing or unknown `datasetId`, invalid `amount`, or an `amount` that does not match the listed price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                priceMismatch:
                  value: { error: amount does not match the listed price }
                unknownDataset:
                  value: { error: "unknown datasetId: ds_nope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PayPalNotConfigured"
        default:
          $ref: "#/components/responses/PayPalFailure"
    patch:
      tags: [Orders]
      operationId: advanceOrder
      summary: Advance an order through the escrow state machine
      description: |
        Actions map to escrow events: `authorize` (MATCHED → AUTHORIZED),
        `deliver` (AUTHORIZED → DELIVERED), `capture` (DELIVERED → CAPTURED),
        `payout` (CAPTURED → PAID_OUT), `void` (AUTHORIZED → VOIDED),
        `dispute` (AUTHORIZED/DELIVERED → DISPUTED), `cancel` (MATCHED →
        CANCELLED, the buyer backing out before approving; no PayPal call, since
        nothing was held), and `resolve` with `resolution: capture | void`
        (DISPUTED → CAPTURED | VOIDED).

        The stored row is the source of truth for the current state and PayPal
        ids. The transition is validated **before** any PayPal call, so an
        illegal move never charges anyone and never writes (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceOrderRequest"
            examples:
              authorize:
                value:
                  {
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f,
                    action: authorize,
                  }
              dispute:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  action: dispute
                  note: Delivered file is missing the medications table
              cancel:
                summary: Buyer backs out before approving in PayPal
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  action: cancel
              resolve:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  action: resolve
                  resolution: void
                  note: Vendor could not supply the missing table
      responses:
        "200":
          description: Escrow advanced; the new state plus any PayPal id produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvanceOrderResponse"
              examples:
                authorized:
                  value:
                    escrowState: AUTHORIZED
                    authorizationId: MOCK-AUTH-e5f6a7b8
                    status: COMPLETED
                    mock: true
                delivered:
                  value: { escrowState: DELIVERED, mock: true }
                captured:
                  value:
                    escrowState: CAPTURED
                    captureId: MOCK-CAP-9a8b7c6d
                    status: COMPLETED
                    mock: true
                paidOut:
                  value:
                    escrowState: PAID_OUT
                    payoutBatchId: MOCK-PAYOUT-1f2e3d4c
                    status: PENDING
                    mock: true
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Illegal transition from the order's current state, or the order lacks the PayPal id the action needs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                illegal:
                  value:
                    {
                      error: "Invalid escrow transition: CAPTURE not allowed from MATCHED",
                    }
                noAuthorization:
                  value: { error: order has no authorization to capture }
                cancelAfterApproval:
                  value:
                    {
                      error: "Invalid escrow transition: CANCEL not allowed from AUTHORIZED",
                    }
        "422":
          description: Unknown `action`, missing `orderId`, or `resolve` without a valid `resolution`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badAction:
                  value:
                    error: "action must be one of: authorize, deliver, capture, payout, void, dispute, cancel, resolve"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: "`payout` in live mode: real PayPal Payouts is not implemented yet."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                payouts:
                  value: { error: real PayPal Payouts not implemented }
        "503":
          $ref: "#/components/responses/PayPalNotConfigured"
        default:
          $ref: "#/components/responses/PayPalFailure"

  /api/query:
    post:
      tags: [Query]
      operationId: runQuery
      summary: Ask a plain-English question of a purchased dataset
      description: |
        Requires an order for this dataset in `DELIVERED`, `CAPTURED` or
        `PAID_OUT`. The question is screened for identifiers and row-level asks,
        compiled to parameterized aggregate-only SQL, re-checked, executed
        vendor-side (mocked), and put through small-cell suppression (k ≥ 11).
        Only answered queries are billed, at the server-set per-query fee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              avgAgeBySex:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  datasetId: ds_cardio_synthea_v1
                  question: average age by sex
      responses:
        "200":
          description: Aggregate answer, with the usage row it was billed as.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              examples:
                answered:
                  value:
                    datasetId: ds_cardio_synthea_v1
                    question: average age by sex
                    compiled:
                      sql: 'SELECT sex AS "group", AVG(age) AS avg_age FROM records WHERE dataset_id = ? GROUP BY sex'
                      params: [ds_cardio_synthea_v1]
                    result:
                      - { group: female, avg_age: 77 }
                      - { group: male, avg_age: 60 }
                    summary: The average age by sex ranges from 60 (male) to 77 (female).
                    usage:
                      usageId: qu_5b6c7d8e-9f01-4a2b-8c3d-4e5f60718293
                      chargeCents: 50
        "403":
          description: Order does not grant data access, or the question/SQL/result was rejected by the privacy guard (`reasons` explains why). When a safe aggregate rephrasing exists, `suggestion` carries it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                pii:
                  value:
                    error: query rejected
                    reasons:
                      - 'Question mentions a PII/identifier field: "name".'
                      - 'Question mentions a PII/identifier field: "ssn".'
                withSuggestion:
                  summary: Refused question with a safe rewrite
                  value:
                    error: query rejected
                    reasons:
                      - 'Question mentions a PII/identifier field: "zip".'
                    suggestion: How many patients are there by region?
                noAccess:
                  value:
                    {
                      error: order does not grant data access (status AUTHORIZED),
                    }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Missing fields, question longer than 500 characters, or the order is for a different dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    {
                      error: "orderId, datasetId and question (non-empty strings) are required",
                    }
        "500":
          description: The order could not be loaded or usage could not be recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                usage:
                  value: { error: could not record query usage }

  /api/billing:
    get:
      tags: [Billing]
      operationId: getBilling
      summary: An order's per-query usage and spend
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            {
              type: string,
              examples: [ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f],
            }
      responses:
        "200":
          description: Usage rows (newest first) with count and total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingResponse"
              examples:
                billed:
                  value:
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    usage:
                      - id: qu_5b6c7d8e-9f01-4a2b-8c3d-4e5f60718293
                        order_id: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                        question: average age by sex
                        charge_cents: 50
                        created_at: "2026-10-21 17:04:02"
                    queryCount: 1
                    totalCents: 50
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Billing]
      operationId: recordUsage
      summary: Record one per-query charge
      description: |
        Records a usage row at the server-set fee (`PER_QUERY_FEE_CENTS`, 50).
        `chargeCents` is accepted only as a confirmation; any other value is
        422. The order must grant data access, otherwise 409. This is where a
        real PayPal per-query capture would fire (mocked).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUsageRequest"
            examples:
              charge:
                value:
                  orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                  question: count by region
                  chargeCents: 50
      responses:
        "201":
          description: Usage recorded and charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordUsageResponse"
              examples:
                charged:
                  value:
                    usageId: qu_6c7d8e9f-0a1b-4c2d-9e3f-50617283a4b5
                    orderId: ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f
                    chargeCents: 50
                    charged: true
        "409":
          description: The order's escrow state does not grant data access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notDelivered:
                  value:
                    {
                      error: "order is AUTHORIZED; queries are billable only once data access is granted",
                    }
        "422":
          description: Missing fields, unknown order, or a `chargeCents` that differs from the server fee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrongFee:
                  value:
                    {
                      error: "chargeCents is set by the server (per-query fee is 50)",
                    }

  /api/agent:
    get:
      tags: [Agent]
      operationId: getAgentRun
      summary: Read a stored agent run (audit trail)
      description: |
        Every POST /api/agent run is saved before the response is sent: the
        study, budget, planner, the escrow order it opened (if any), the full
        tool-call trace including refusals, and the agent's reasoning.
      parameters:
        - name: runId
          in: query
          required: true
          description: The `runId` returned by POST /api/agent.
          schema:
            {
              type: string,
              examples: [run_7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b],
            }
      responses:
        "200":
          description: The stored run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
              examples:
                run:
                  value:
                    runId: run_7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    study: Outcomes of statin therapy in adults with coronary heart disease
                    budgetCents: 6000
                    source: scripted
                    orderId: ord_3f9c2a1e
                    steps:
                      - tool: search_datasets
                        input:
                          { study: statin therapy in coronary heart disease }
                        output: { matches: 2 }
                        at: "2026-10-21T18:02:11.000Z"
                    recommendation:
                      datasetId: ds_cardio_synthea_v1
                      reasoning: Best match within budget; sample check passed
                    shortlist:
                      - datasetId: ds_cardio_synthea_v1
                        title: Synthetic Cardiology Cohort (Synthea)
                        priceCents: 4900
                        fitScore: 2
                        sampleCheck: passed
                        withinBudget: true
                        reason: "Chosen, the best fit that cleared every check."
                        chosen: true
                    createdAt: "2026-10-21 18:02:12"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Agent]
      operationId: runProcurementAgent
      summary: Run the AI procurement agent
      description: |
        Agentic commerce: given a study and a budget, the agent searches the
        catalog, inspects datasets, sample-checks a candidate, and only then
        opens a PayPal escrow order (MATCHED + approve URL). Funds are held only
        after the buyer approves in PayPal; the agent never authorizes or
        captures.

        Claude on Amazon Bedrock drives the tool loop when
        `LLM_PROVIDER=bedrock`; otherwise a deterministic scripted planner runs
        the same tools (`source` says which). Guardrails are enforced in code,
        not the prompt: price must fit `budgetCents`, a passing sample check for
        that dataset must come first, and at most one order is created per run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequest"
            examples:
              run:
                value:
                  study: Outcomes of statin therapy in adults with coronary heart disease
                  budgetCents: 6000
                  buyerEmail: researcher@university.edu
      responses:
        "200":
          description: Agent run trace, recommendation and the ranked shortlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
              examples:
                run:
                  value:
                    runId: run_7e8f9a0b-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    steps:
                      - tool: search_datasets
                        input:
                          { study: statin therapy in coronary heart disease }
                        output: { matches: 2 }
                        at: "2026-10-21T18:02:11.000Z"
                      - tool: check_sample
                        input: { datasetId: ds_cardio_synthea_v1 }
                        output: { passed: true, score: 97 }
                        at: "2026-10-21T18:02:11.000Z"
                      - tool: create_escrow_order
                        input:
                          {
                            datasetId: ds_cardio_synthea_v1,
                            justification: Best fit within budget,
                          }
                        output: { orderId: ord_3f9c2a1e, escrowState: MATCHED }
                        at: "2026-10-21T18:02:12.000Z"
                    recommendation:
                      datasetId: ds_cardio_synthea_v1
                      reasoning: Best match within budget; sample check passed
                    shortlist:
                      - datasetId: ds_cardio_synthea_v1
                        title: Synthetic Cardiology Cohort (Synthea)
                        priceCents: 4900
                        fitScore: 2
                        sampleCheck: passed
                        withinBudget: true
                        reason: "Chosen, the best fit that cleared every check."
                        chosen: true
                      - datasetId: ds_diabetes_synthea_v1
                        title: Synthetic Type 2 Diabetes Cohort (Synthea)
                        priceCents: 5900
                        fitScore: 1
                        sampleCheck: not_run
                        withinBudget: true
                        reason: "Matched on: cohort"
                        chosen: false
                    order:
                      orderId: ord_3f9c2a1e
                      datasetId: ds_cardio_synthea_v1
                      approveUrl: /checkout/mock?token=MOCK-ORDER-a1b2c3d4&orderId=ord_3f9c2a1e
                      escrowState: MATCHED
                      amountCents: 4900
                    source: scripted
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Rate limited (5 agent runs per minute per client).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/datasets:
    get:
      tags: [Catalog]
      operationId: listDatasets
      summary: List catalog datasets with their current prices
      description: |
        Returns every listed dataset with the price stored in the database,
        which is the price escrow orders charge.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                required: [datasets]
                properties:
                  datasets:
                    type: array
                    items: { $ref: "#/components/schemas/Dataset" }
              examples:
                catalog:
                  value:
                    datasets:
                      - id: ds_cardio_synthea_v1
                        vendorId: vnd_demo_health
                        title: Synthetic Cardiology Cohort (Synthea)
                        description: Synthetic patients with cardiovascular conditions.
                        priceCents: 4900
                        recordCount: 10000
                        tags: [cardiology, synthetic, synthea]
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Catalog]
      operationId: updateDatasetPrice
      summary: Change a dataset's listing price
      description: |
        Vendors reprice a listing. The price must be a whole number of cents
        between $1.00 (`100`) and $10,000.00 (`1000000`). The new price is what
        the next `POST /api/orders` escrows and what `POST /api/match` shows.
        Orders that already exist keep the amount they were created with.

        Checks run in this order: body shape and field types (400), then the
        price range and whole cents (422), then the dataset lookup (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datasetId, priceCents]
              properties:
                datasetId: { type: string, minLength: 1 }
                priceCents:
                  type: integer
                  minimum: 100
                  maximum: 1000000
                  description: Whole cents, `100` to `1000000`.
            examples:
              reprice:
                value: { datasetId: ds_cardio_synthea_v1, priceCents: 5400 }
      responses:
        "200":
          description: The updated dataset.
          content:
            application/json:
              schema:
                type: object
                required: [dataset]
                properties:
                  dataset: { $ref: "#/components/schemas/Dataset" }
              examples:
                repriced:
                  value:
                    dataset:
                      id: ds_cardio_synthea_v1
                      vendorId: vnd_demo_health
                      title: Synthetic Cardiology Cohort (Synthea)
                      description: Synthetic patients with cardiovascular conditions.
                      priceCents: 5400
                      recordCount: 10000
                      tags: [cardiology, synthetic, synthea]
        "400":
          description: The body is not a JSON object, `datasetId` is not a non-empty string, or `priceCents` is not a number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notNumber:
                  value: { error: "priceCents (number) is required" }
        "404":
          description: No dataset has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownDataset:
                  value: { error: "unknown dataset: ds_nope" }
        "422":
          description: "`priceCents` is not a whole number of cents, or is outside $1.00 to $10,000.00."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                outOfRange:
                  value:
                    error: "priceCents must be between 100 ($1.00) and 1000000 ($10,000.00)"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/demo/reset:
    post:
      tags: [System]
      operationId: resetDemo
      summary: Reset the demo database (mock mode only)
      description: |
        Clears orders, order events, query usage, webhook dedupe rows and agent
        runs, then reseeds the catalog (including its prices), so a live demo
        can start over between takes. Returns 404 unless `PAYPAL_MODE=mock`.
      responses:
        "200":
          description: Demo data cleared and the catalog reseeded.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
              examples:
                reset:
                  value: { ok: true }
        "404":
          description: Not available outside mock mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notMock:
                  value: { error: "not found" }
        "500":
          $ref: "#/components/responses/InternalError"

  /api/webhooks/paypal:
    post:
      tags: [Webhooks]
      operationId: receivePaypalWebhook
      summary: Receive a PayPal webhook event
      description: |
        PayPal posts payment events here. The raw body is verified with PayPal's
        `verify-webhook-signature` (headers `paypal-transmission-*`,
        `paypal-cert-url`, `paypal-auth-algo`; webhook id `PAYPAL_WEBHOOK_ID`)
        before it is trusted.

        Every event id is recorded in the same transaction as any state change,
        so redeliveries are no-ops (`duplicate`). An event is applied only when
        its escrow transition is legal from the order's current state; anything
        else is acknowledged as `ignored` with a reason. After verification the
        answer is always 200 so PayPal does not retry forever; only an
        unexpected internal failure returns 500 (and the retry is safe).

        Demo only: with `PAYPAL_MODE=mock`, an event is accepted iff it carries
        the header `x-mock-webhook: 1`.
      parameters:
        - { name: paypal-transmission-id, in: header, schema: { type: string } }
        - {
            name: paypal-transmission-time,
            in: header,
            schema: { type: string },
          }
        - {
            name: paypal-transmission-sig,
            in: header,
            schema: { type: string },
          }
        - { name: paypal-cert-url, in: header, schema: { type: string } }
        - { name: paypal-auth-algo, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaypalWebhookEvent"
            examples:
              captureCompleted:
                value:
                  id: WH-58D329510W468432D-8HN650336L201105X
                  event_type: PAYMENT.CAPTURE.COMPLETED
                  resource_type: capture
                  resource: { id: 2GG279541U471931P, status: COMPLETED }
      responses:
        "200":
          description: Event verified (applied, recorded, duplicate, or ignored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
              examples:
                applied:
                  value:
                    {
                      received: true,
                      applied: VOID,
                      orderId: ord_3f2c9a1e,
                      escrowState: VOIDED,
                    }
                recorded:
                  value:
                    {
                      received: true,
                      recorded: true,
                      orderId: ord_3f2c9a1e,
                      escrowState: CAPTURED,
                    }
                duplicate:
                  value: { duplicate: true }
                ignored:
                  value:
                    {
                      ignored: true,
                      reason: "transition not legal from current state",
                    }
        "500":
          $ref: "#/components/responses/InternalError"
        "401":
          description: Webhook signature verification failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    EscrowState:
      type: string
      description: Escrow lifecycle state. `PAID_OUT`, `VOIDED` and `CANCELLED` are terminal.
      enum:
        [
          MATCHED,
          AUTHORIZED,
          DELIVERED,
          CAPTURED,
          PAID_OUT,
          DISPUTED,
          VOIDED,
          CANCELLED,
        ]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        reasons:
          type: array
          description: Present on privacy-guard rejections.
          items: { type: string }
    HealthResponse:
      type: object
      required: [status, mode, db]
      properties:
        status: { type: string, enum: [ok, error] }
        mode: { type: string, enum: [mock, live] }
        db: { type: string, enum: [ok, error] }
    OrderRow:
      type: object
      description: A persisted order row (snake_case, as stored).
      required:
        [
          id,
          dataset_id,
          buyer_email,
          paypal_order_id,
          authorization_id,
          status,
          amount_cents,
          created_at,
          updated_at,
        ]
      properties:
        id:
          { type: string, examples: [ord_3f9c2a1e-7b4d-4c1a-9e2f-0a1b2c3d4e5f] }
        dataset_id: { type: string }
        buyer_email: { type: string }
        paypal_order_id: { type: [string, "null"] }
        authorization_id: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EscrowState" }
        amount_cents:
          {
            type: integer,
            description: Escrowed amount; always the listed price.,
          }
        created_at:
          {
            type: string,
            description: "SQLite timestamp, `YYYY-MM-DD HH:MM:SS` UTC.",
          }
        updated_at: { type: [string, "null"] }
    OrderEventRow:
      type: object
      description: One audit-trail row per lifecycle transition (append-only).
      required:
        [id, order_id, seq, event, from_state, to_state, note, created_at]
      properties:
        id: { type: string }
        order_id: { type: string }
        seq:
          {
            type: integer,
            description: Monotonic per-order position; 0 is the genesis row.,
          }
        event:
          type: string
          description: "`CREATE` for the genesis row, otherwise the escrow event."
          enum:
            [
              CREATE,
              AUTHORIZE,
              DELIVER,
              CAPTURE,
              PAYOUT,
              DISPUTE,
              RESOLVE_CAPTURE,
              RESOLVE_VOID,
              VOID,
              CANCEL,
            ]
        from_state:
          oneOf:
            - $ref: "#/components/schemas/EscrowState"
            - type: "null"
        to_state: { $ref: "#/components/schemas/EscrowState" }
        note:
          {
            type: [string, "null"],
            description: Dispute reason or resolution note.,
          }
        created_at: { type: string }
    UsageRow:
      type: object
      required: [id, order_id, question, charge_cents, created_at]
      properties:
        id:
          { type: string, examples: [qu_5b6c7d8e-9f01-4a2b-8c3d-4e5f60718293] }
        order_id: { type: string }
        question: { type: string }
        charge_cents: { type: integer }
        created_at: { type: string }
    OrderSummary:
      type: object
      description: Vendor earnings roll-up. Every escrow state is present in `countsByStatus` (zero-filled).
      required:
        [countsByStatus, heldCents, capturedCents, paidOutCents, releasedCents]
      properties:
        countsByStatus:
          type: object
          required:
            [
              MATCHED,
              AUTHORIZED,
              DELIVERED,
              CAPTURED,
              PAID_OUT,
              DISPUTED,
              VOIDED,
              CANCELLED,
            ]
          properties:
            MATCHED: { type: integer }
            AUTHORIZED: { type: integer }
            DELIVERED: { type: integer }
            CAPTURED: { type: integer }
            PAID_OUT: { type: integer }
            DISPUTED: { type: integer }
            VOIDED: { type: integer }
            CANCELLED: { type: integer }
        heldCents:
          { type: integer, description: AUTHORIZED + DELIVERED + DISPUTED. }
        capturedCents: { type: integer, description: CAPTURED + PAID_OUT. }
        paidOutCents: { type: integer, description: PAID_OUT. }
        releasedCents: { type: integer, description: VOIDED. }
    MatchRequest:
      type: object
      required: [description]
      properties:
        description:
          {
            type: string,
            minLength: 1,
            description: Plain-English study description.,
          }
    SampleCheckRequest:
      type: object
      required: [sampleCheck]
      properties:
        sampleCheck:
          {
            type: string,
            minLength: 1,
            description: Dataset id to sample-check.,
          }
        description:
          { type: string, description: Optional study description for context. }
    Dataset:
      type: object
      description: A catalog listing. `priceCents` is the database price, the amount escrow orders charge.
      required:
        [id, vendorId, title, description, priceCents, recordCount, tags]
      properties:
        id: { type: string }
        vendorId: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        priceCents:
          type: integer
          description: Listed price in cents (the amount POST /api/orders escrows).
        recordCount:
          type: [integer, "null"]
          description: Records in the dataset; null if not listed.
        tags: { type: array, items: { type: string } }
    DatasetMatch:
      type: object
      required: [datasetId, score, rationale, title, priceCents, recordCount]
      properties:
        datasetId: { type: string }
        score: { type: number }
        rationale: { type: string }
        title: { type: [string, "null"] }
        priceCents:
          type: [integer, "null"]
          description: The database price (what an order charges).
        recordCount:
          type: [integer, "null"]
          description: Records in the dataset, from the catalog; null if not listed.
        source: { type: string, enum: [llm, keyword] }
    MatchResponse:
      type: object
      required: [matches, source]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/DatasetMatch" }
        source:
          type: string
          enum: [llm, keyword]
          description: Whether the ranking came from the model or the keyword fallback.
    SampleCheckResponse:
      type: object
      required: [sampleCheck]
      properties:
        sampleCheck:
          type: object
          required: [passed, score, findings, source]
          properties:
            passed: { type: boolean }
            score: { type: number, minimum: 0, maximum: 100 }
            findings:
              type: array
              items: { type: string }
            source: { type: string, enum: [llm, rules] }
    OrderListResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/OrderRow" }
    OrderDetailResponse:
      type: object
      required: [order, authorization]
      properties:
        order: { $ref: "#/components/schemas/OrderRow" }
        authorization:
          description: The PayPal hold window while funds are held (AUTHORIZED, DELIVERED, DISPUTED); null otherwise.
          oneOf:
            - $ref: "#/components/schemas/AuthorizationWindow"
            - type: "null"
        events:
          type: array
          description: Present when `events` is passed; oldest first.
          items: { $ref: "#/components/schemas/OrderEventRow" }
    AuthorizationWindow:
      type: object
      description: How long a PayPal authorization (the buyer's held funds) can still be captured. Measured from the AUTHORIZE event. Honored for 3 days, valid for up to 29.
      required: [authorizedAt, honorUntil, expiresAt, state, daysLeft]
      properties:
        authorizedAt: { type: string, format: date-time }
        honorUntil:
          type: string
          format: date-time
          description: End of the 3-day honor period. PayPal guarantees the funds until then.
        expiresAt:
          type: string
          format: date-time
          description: End of the 29-day validity period. After this the hold must be reauthorized.
        state:
          type: string
          enum: [honor, valid, expired]
          description: Where `now` falls in the window.
        daysLeft:
          type: integer
          minimum: 0
          description: Whole days left until `expiresAt`, rounded up; 0 once expired.
    OrderReceiptResponse:
      type: object
      required: [order, receipt]
      properties:
        order: { $ref: "#/components/schemas/OrderRow" }
        receipt: { $ref: "#/components/schemas/Receipt" }
    Receipt:
      type: object
      description: What the buyer paid and how it splits between vendor and platform. `platformFeeCents + vendorPayoutCents = amountCents`. VOIDED and CANCELLED orders are all zeros for money.
      required:
        [
          orderId,
          datasetId,
          status,
          amountCents,
          platformFeeCents,
          vendorPayoutCents,
          queryCount,
          queryChargesCents,
          totalCents,
        ]
      properties:
        orderId: { type: string }
        datasetId: { type: string }
        status: { $ref: "#/components/schemas/EscrowState" }
        amountCents:
          type: integer
          description: The escrowed price (the captured amount once captured). 0 for VOIDED or CANCELLED.
        platformFeeCents:
          { type: integer, description: Platform share of amountCents (10%). }
        vendorPayoutCents:
          { type: integer, description: amountCents minus platformFeeCents. }
        queryCount:
          type: integer
          description: Queries run against the order, including any on a voided order.
        queryChargesCents:
          {
            type: integer,
            description: Sum of the per-query charges. 0 for VOIDED or CANCELLED.,
          }
        totalCents:
          { type: integer, description: amountCents + queryChargesCents. }
    OrderSummaryResponse:
      type: object
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/OrderSummary" }
    CreateOrderRequest:
      type: object
      required: [datasetId]
      properties:
        datasetId: { type: string }
        amount:
          type: number
          exclusiveMinimum: 0
          description: Optional confirmation of the listed price, in major units (e.g. 49 for $49.00).
        currency:
          {
            type: string,
            description: ISO currency code (live mode only). Defaults to USD.,
          }
        referenceId:
          {
            type: string,
            description: PayPal purchase-unit reference (live mode only).,
          }
        buyerEmail:
          { type: string, description: Defaults to demo-buyer@meddata.test. }
    CreateOrderResponse:
      type: object
      required: [orderId, paypalOrderId, status, approveUrl, escrowState]
      properties:
        orderId: { type: string }
        paypalOrderId: { type: string }
        status:
          { type: string, description: PayPal order status (e.g. CREATED). }
        approveUrl:
          type: string
          format: uri-reference
          description: PayPal's approval link, or the relative `/checkout/mock` page in mock mode.
        escrowState: { $ref: "#/components/schemas/EscrowState" }
        reused:
          type: boolean
          const: true
          description: Present (true) when an existing unapproved order was returned instead of a new one.
        mock: { type: boolean, description: Present (true) in mock mode. }
    AdvanceOrderRequest:
      type: object
      required: [orderId, action]
      properties:
        orderId: { type: string }
        action:
          type: string
          enum:
            [
              authorize,
              deliver,
              capture,
              payout,
              void,
              dispute,
              cancel,
              resolve,
            ]
        resolution:
          type: string
          enum: [capture, void]
          description: Required when `action` is `resolve`.
        requestId:
          {
            type: string,
            description: PayPal idempotency key for capture (live mode).,
          }
        note:
          {
            type: string,
            maxLength: 500,
            description: "Recorded on the audit event (trimmed, capped at 500 chars).",
          }
    AdvanceOrderResponse:
      type: object
      required: [escrowState]
      properties:
        escrowState: { $ref: "#/components/schemas/EscrowState" }
        authorizationId:
          { type: string, description: Present after `authorize`. }
        captureId:
          {
            type: string,
            description: Present after `capture` or `resolve` (capture).,
          }
        payoutBatchId:
          { type: string, description: Present after `payout` (mock mode). }
        status: { type: string, description: PayPal status of the money move. }
        mock: { type: boolean }
    CompiledQuery:
      type: object
      required: [sql, params]
      properties:
        sql: { type: string, description: "Parameterized, aggregate-only SQL." }
        params:
          type: array
          items: {}
    QueryRequest:
      type: object
      required: [orderId, datasetId, question]
      properties:
        orderId: { type: string }
        datasetId: { type: string }
        question: { type: string, minLength: 1, maxLength: 500 }
    QueryResponse:
      type: object
      required: [datasetId, question, compiled, result, summary, usage]
      properties:
        datasetId: { type: string }
        question: { type: string }
        compiled: { $ref: "#/components/schemas/CompiledQuery" }
        result:
          type: array
          description: Aggregate rows only; every count is at or above the small-cell threshold.
          items:
            type: object
            additionalProperties:
              type: [string, number]
        summary:
          type: string
          description: One plain sentence describing the result. It never quotes a cell below the small-cell threshold. Claude may reword it; a number guard falls back to the rule-based wording if the model adds a figure the rows do not contain.
        usage:
          type: object
          required: [usageId, chargeCents]
          properties:
            usageId: { type: string }
            chargeCents: { type: integer }
    BillingResponse:
      type: object
      required: [orderId, usage, queryCount, totalCents]
      properties:
        orderId: { type: string }
        usage:
          type: array
          items: { $ref: "#/components/schemas/UsageRow" }
        queryCount: { type: integer }
        totalCents: { type: integer }
    RecordUsageRequest:
      type: object
      required: [orderId, question]
      properties:
        orderId: { type: string }
        question: { type: string, minLength: 1 }
        chargeCents:
          {
            type: integer,
            const: 50,
            description: Optional confirmation of the server fee.,
          }
    RecordUsageResponse:
      type: object
      required: [usageId, orderId, chargeCents, charged]
      properties:
        usageId: { type: string }
        orderId: { type: string }
        chargeCents: { type: integer }
        charged: { type: boolean }
    AgentRequest:
      type: object
      required: [study, budgetCents]
      properties:
        study:
          type: string
          minLength: 1
          maxLength: 1000
          description: Plain-English study description.
        budgetCents:
          type: integer
          minimum: 1
          description: Hard spending cap; enforced in code.
        buyerEmail:
          type: string
          format: email
    AgentStep:
      type: object
      required: [tool, input, at]
      properties:
        tool:
          type: string
          enum:
            [search_datasets, get_dataset, check_sample, create_escrow_order]
        input: { type: object, additionalProperties: true }
        output: { description: Tool result (absent when the call errored). }
        error:
          { type: string, description: Why the call was refused or failed. }
        at: { type: string, format: date-time }
    AgentResponse:
      type: object
      required: [runId, steps, recommendation, shortlist, source]
      properties:
        runId: { type: string }
        steps:
          type: array
          description: Ordered trace of every tool call, including refusals.
          items: { $ref: "#/components/schemas/AgentStep" }
        recommendation:
          type: object
          required: [datasetId, reasoning]
          properties:
            datasetId:
              type: [string, "null"]
              description: The dataset ordered, or null if nothing was bought.
            reasoning: { type: string }
        shortlist:
          type: array
          description: Candidates the run considered, best first. The chosen dataset (if any) is ranked first.
          items: { $ref: "#/components/schemas/ShortlistItem" }
        order:
          type: object
          description: Present when the agent opened an escrow order.
          required: [orderId, datasetId, approveUrl, escrowState, amountCents]
          properties:
            orderId: { type: string }
            datasetId: { type: string }
            approveUrl:
              type: string
              format: uri-reference
              description: Absolute PayPal link, or a relative `/checkout/mock` link in mock mode.
            escrowState: { $ref: "#/components/schemas/EscrowState" }
            amountCents: { type: integer }
        source: { type: string, enum: [llm, scripted] }
    ShortlistItem:
      type: object
      description: One candidate in an agent run's shortlist. Derived from the run's recorded steps, so older runs get one too.
      required:
        [
          datasetId,
          title,
          priceCents,
          fitScore,
          sampleCheck,
          withinBudget,
          reason,
          chosen,
        ]
      properties:
        datasetId: { type: string }
        title: { type: [string, "null"] }
        priceCents: { type: [integer, "null"] }
        fitScore:
          type: [number, "null"]
          description: Relevance score from the search step; null if the dataset was never searched.
        sampleCheck: { type: string, enum: [passed, failed, not_run] }
        withinBudget:
          type: [boolean, "null"]
          description: Whether the price fits `budgetCents`; null when the price is unknown.
        reason:
          type: string
          maxLength: 140
          description: One short sentence on why the candidate ranks where it does.
        chosen:
          type: boolean
          description: True for the dataset the run recommended or opened an order for.
    AgentRun:
      type: object
      description: A persisted agent run (agent_runs audit table).
      required:
        [
          runId,
          study,
          budgetCents,
          source,
          orderId,
          steps,
          recommendation,
          shortlist,
          createdAt,
        ]
      properties:
        runId: { type: string }
        study: { type: string }
        budgetCents: { type: integer }
        source: { type: string, enum: [llm, scripted] }
        orderId:
          type: [string, "null"]
          description: The escrow order the run opened, or null.
        steps:
          type: array
          items: { $ref: "#/components/schemas/AgentStep" }
        recommendation:
          type: [object, "null"]
          required: [datasetId, reasoning]
          properties:
            datasetId: { type: [string, "null"] }
            reasoning: { type: string }
        shortlist:
          type: array
          description: Ranked candidates, best first (rebuilt from the stored steps).
          items: { $ref: "#/components/schemas/ShortlistItem" }
        createdAt:
          type: string
          description: SQLite CURRENT_TIMESTAMP (UTC, "YYYY-MM-DD HH:MM:SS").
    PaypalWebhookEvent:
      type: object
      required: [id, event_type, resource]
      properties:
        id: { type: string }
        event_type:
          {
            type: string,
            examples: [PAYMENT.CAPTURE.COMPLETED, PAYMENT.AUTHORIZATION.VOIDED],
          }
        resource_type: { type: string }
        resource:
          type: object
          additionalProperties: true
    WebhookAck:
      type: object
      properties:
        received: { type: boolean }
        applied:
          type: string
          description: The escrow event applied (e.g. VOID, DISPUTE).
        recorded:
          { type: boolean, description: Relevant event, no state change. }
        orderId: { type: string }
        escrowState: { $ref: "#/components/schemas/EscrowState" }
        duplicate:
          { type: boolean, description: The event id was already processed. }
        ignored:
          {
            type: boolean,
            description: Unknown type,
            no matching order,
            or illegal transition.,
          }
        reason: { type: string }
  responses:
    ValidationError:
      description: Invalid or missing request fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              value: { error: "description (non-empty string) is required" }
    NotFound:
      description: Unknown order id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unknownOrder:
              value: { error: "unknown orderId: ord_missing" }
    InternalError:
      description: Unexpected server error (details are logged, never returned).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internal:
              value: { error: internal error }
    PayPalNotConfigured:
      description: Live mode without PayPal credentials (set PAYPAL_MODE=mock or fill .env.local).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            notConfigured:
              value: { error: PayPal not configured (see .env.example) }
    PayPalFailure:
      description: A PayPal API call failed; the status mirrors PayPal's response status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            paypal:
              value: { error: PayPal request failed }
