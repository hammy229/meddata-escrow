# Keeps the free Render instance awake so the live demo answers at once.
# Set the repository variable LIVE_URL (Settings -> Secrets and variables ->
# Actions -> Variables), e.g. https://meddata-escrow.onrender.com. With no
# LIVE_URL the job does nothing.
name: Keep alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "LIVE_URL is not set; nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            --max-time 90 "$LIVE_URL/api/health"
