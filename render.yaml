# Render deploy config — https://render.com/docs/blueprint-spec
# Secrets (PayPal, LLM) are set in the Render dashboard, never committed.
services:
  - type: web
    name: meddata-escrow
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: meddata-escrow-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  - name: meddata-escrow-db
    plan: free
