# Render deploy config — https://render.com/docs/blueprint-spec
# Secrets (PayPal, AWS) are set in the Render dashboard, never committed.
#
# Hosted app data uses Render Postgres. Provider source credentials are encrypted.
# Apply this blueprint in Render to provision the database and generated secrets.
# Free PostgreSQL is for evaluation; choose a paid plan for durable production use.
services:
  - type: web
    name: meddata-escrow
    runtime: node
    plan: free
    # tsx (a devDependency) runs the seed script at boot, so keep dev deps.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      # node:sqlite needs Node >= 22 (package.json engines); match CI's 24.
      - key: NODE_VERSION
        value: "24"
      - key: APP_DATABASE_URL
        fromDatabase:
          name: meddata-escrow-db
          property: connectionString
      # Render private-network PostgreSQL uses a self-signed certificate.
      # Require encryption on that internal connection. Provider sources still
      # require full certificate verification.
      - key: APP_DATABASE_TLS_MODE
        value: require
      - key: CONNECTION_ENCRYPTION_KEY
        generateValue: true
      - key: MANDATE_SECRET
        generateValue: true
      - key: PROVIDER_DATABASE_HOSTS
        sync: false
      # Runs the full escrow arc with no PayPal keys. Remove (and set the
      # PAYPAL_* secrets below) to run against the PayPal sandbox.
      - key: PAYPAL_MODE
        value: mock
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Claude on Amazon Bedrock. Set LLM_PROVIDER=bedrock plus AWS keys to
      # enable it; otherwise the deterministic fallbacks are used.
      - key: LLM_PROVIDER
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OUTBOUND_WEBHOOK_URL
        sync: false
      - key: OUTBOUND_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

databases:
  - name: meddata-escrow-db
    databaseName: meddata_escrow
    user: meddata_app
    plan: free
    ipAllowList: []
