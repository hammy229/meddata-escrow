# Render deploy config — https://render.com/docs/blueprint-spec
# Secrets (PayPal, AWS) are set in the Render dashboard, never committed.
#
# Hosted app data lives in an external PostgreSQL (a free Neon database works and
# never expires, unlike Render's free Postgres, which is deleted after 30 days).
# Render asks for APP_DATABASE_URL when the blueprint is applied. Provider source
# credentials are encrypted. .github/workflows/keep-alive.yml pings the service so
# the free instance does not sleep.
services:
  - type: web
    name: meddata-escrow
    runtime: node
    plan: free
    # Same AWS region as the Neon database (us-east-1).
    region: virginia
    # tsx (a devDependency) runs the seed script at boot, so keep dev deps.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      # node:sqlite needs Node >= 22 (package.json engines); match CI's 24.
      - key: NODE_VERSION
        value: "24"
      # Neon's DIRECT connection string (turn "Connection pooling" off; the
      # pooler rejects the timezone and timeout settings the app sends), with
      # sslmode=require. Neon's certificate is publicly trusted, so the default
      # verify-full TLS mode applies.
      - key: APP_DATABASE_URL
        sync: false
      - key: CONNECTION_ENCRYPTION_KEY
        generateValue: true
      - key: MANDATE_SECRET
        generateValue: true
      # Bearer secret for POST /api/escrow/sweep (escrow deadlines).
      - key: ESCROW_SWEEP_SECRET
        generateValue: true
      - key: PROVIDER_DATABASE_HOSTS
        sync: false
      # Runs the full escrow arc with no PayPal keys. Remove (and set the
      # PAYPAL_* secrets below) to run against the PayPal sandbox.
      - key: PAYPAL_MODE
        value: mock
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Claude on Amazon Bedrock. Set LLM_PROVIDER=bedrock plus AWS keys to
      # enable it; otherwise the deterministic fallbacks are used.
      - key: LLM_PROVIDER
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OUTBOUND_WEBHOOK_URL
        sync: false
      - key: OUTBOUND_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
